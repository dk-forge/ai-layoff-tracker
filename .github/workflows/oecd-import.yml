name: OECD unemployment reference data

# One keyless OECD SDMX request (DF_IALFS_UNE_M: monthly unemployment rate by
# sex and age, every member country) -> /reference-ingest/oecd_unemployment.
# LABELED MACRO CONTEXT, never summed into layoff counts and not read by
# ingest or classification. CC BY 4.0: attribution travels in the payload.
# The data are monthly; the pull is weekly so a release lands within a week
# and the freshness alarm can be tight. Fail-soft: never overwrites with a
# failed or partial pull. Freshness: reference-freshness.yml. History:
# oecd-archive.yml.

on:
  schedule:
    - cron: '35 14 * * 4'   # Thursdays
  workflow_dispatch:

permissions:
  contents: write   # commit the deferral ledger, and only when it changed

concurrency:
  group: oecd-import

jobs:
  oecd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Fetch + store OECD reference data
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: python oecd_import.py

      - name: Record the deferral ledger
        if: ${{ always() }}
        uses: ./.github/actions/commit-deferral-ledger
        with:
          job: oecd-import
