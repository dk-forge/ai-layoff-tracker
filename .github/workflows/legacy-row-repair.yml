name: Legacy row repair (names + country)

# Manual only. Repairs rows a re-import can no longer reach: the site address
# stored inside an employer name, and a blank country where DETERMINISTIC
# evidence exists (a US state code, or a US state government WARN source).
# Publisher nationality is never used as evidence of layoff location.
# Every change lands in the public corrections log via /edit.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually write. Leave false for a dry run."
        required: true
        default: false
        type: boolean
      only:
        description: "Which repair to run"
        required: false
        default: both
        type: choice
        options: [both, names, country]
      max:
        description: "Cap on edits"
        required: false
        default: '500'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements-min.lock
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Repair legacy rows
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          IN_APPLY: ${{ inputs.apply }}
          IN_ONLY: ${{ inputs.only }}
          IN_MAX: ${{ inputs.max }}
        run: |
          ARGS=()
          if [ "$IN_APPLY" = "true" ]; then ARGS+=(--apply); fi
          for attempt in 1 2 3; do
            python3 railway/legacy_row_repair.py --only "$IN_ONLY" --max "$IN_MAX" "${ARGS[@]}" && exit 0
            echo "::warning::attempt $attempt failed; auto-retrying in $((attempt*45))s"
            sleep $((attempt*45))
          done
          echo "::error::still failing after 3 attempts"
          exit 1
