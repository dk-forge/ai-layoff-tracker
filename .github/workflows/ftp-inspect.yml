name: FTP inspect (read-only)

# READ-ONLY diagnostic. Lists plugin directories over FTPS so a stray/orphan
# copy of the plugin can be located precisely before anyone deletes anything.
#
# Why this exists: a run on 2026-07-27 uploaded the plugin to a WP_PLUGIN_REMOTE_DIR
# that was not the live plugin directory, leaving an orphan copy. GitHub redacts
# secret VALUES in logs, so the destination path was masked and could not be read
# back from the run. This job prints directory LISTINGS (never secrets) so the
# orphan can be found.
#
# SAFETY: this workflow never writes, moves or deletes. It only runs `cls`/`ls`.
# Manual dispatch only — no schedule.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: List plugin directories (read-only)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          # Candidate parents to inspect. Each is listed if it exists; a missing
          # path just prints a note and moves on (fail-exit stays OFF so one bad
          # path cannot abort the sweep).
          CANDIDATES="
          /home1/xhcvdemy/public_html/AskTheRecruiter.com/blog/wp-content/plugins
          /home1/xhcvdemy/public_html/wp-content/plugins
          /home1/xhcvdemy/public_html/AskTheRecruiter.com/wp-content/plugins
          /home1/xhcvdemy/public_html
          /home1/xhcvdemy/public_html/AskTheRecruiter.com
          /public_html/wp-content/plugins
          /public_html
          "
          for DIR in $CANDIDATES; do
            echo ""
            echo "=================================================="
            echo "LISTING: $DIR"
            echo "=================================================="
            lftp -c "
              set ssl:verify-certificate no;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set net:max-retries 1;
              set net:timeout 15;
              open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
              cls -l --sort=date \"$DIR\";
            " 2>&1 | head -60 || echo "  (not present or not readable)"
          done
          echo ""
          echo "Done. Look for any ai-layoff-tracker folder OUTSIDE"
          echo "  /home1/xhcvdemy/public_html/AskTheRecruiter.com/blog/wp-content/plugins/"
          echo "That one is the live plugin and must NOT be deleted."
