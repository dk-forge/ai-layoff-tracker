name: Deploy WordPress plugin

# Ships wordpress-plugin/ai-layoff-tracker/ to the live site whenever the
# plugin changes on main — no manual zip/upload. Any push that touches the
# plugin folder deploys it; you can also run it by hand (Actions tab → Run
# workflow, or `gh workflow run deploy-plugin.yml`).
#
# The Railway pipeline (railway/) is NOT handled here — Railway already
# auto-deploys from this repo on push. This workflow is only the plugin.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST      e.g. asktherecruiter.com  (or the server host from cPanel)
#   FTP_USER      an FTP account username from cPanel → FTP Accounts
#   FTP_PASSWORD  that account's password
# Optional:
#   WP_PLUGIN_REMOTE_DIR  defaults to the path below
#
# Add FTP_PASSWORD yourself — never paste it into a chat. GitHub encrypts it
# and it is never printed in logs.

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-plugin/ai-layoff-tracker/**'
      - '.github/workflows/deploy-plugin.yml'
  workflow_dispatch:      # manual trigger from the Actions tab or gh CLI

concurrency:
  group: deploy-plugin
  cancel-in-progress: false   # let an in-flight deploy finish before the next

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 6 -> 15, MEASURED 2026-08-07. The reader-verification step below polls for
    # up to 600s, and it was added under a 360s job timeout, so the wait could
    # never run to completion. Every deploy from 2026-08-05 08:00 onward ran all
    # of its steps successfully and was then killed and reported CANCELLED at
    # 366-380s; deploys before that step took 61-114s. That cost two things: red
    # CI on every deploy (which mails the owner), and the loss of the one signal
    # CLAUDE.md tells an egress-blocked session to trust, since "a green deploy
    # run IS proof it's live" needs a green deploy run to exist.
    # 15 = 600s wait + 114s slowest measured deploy + headroom, still bounded.
    # railway/tests/test_deploy_reaches_readers.py pins the two together.
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up PHP for syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint every plugin PHP file before upload
        run: |
          set -euo pipefail
          find wordpress-plugin/ai-layoff-tracker -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      # Minify JS/CSS IN PLACE on the runner copy before upload: the repo keeps
      # readable source (git is canonical), production serves the small files.
      # Perf audit 2026-07-25: layoffs.js 215KB->~100KB raw (~46KB gzip saved
      # with the CSS). A minifier failure fails the deploy loudly rather than
      # shipping a half-minified tree; terser output is syntax-checked by node.
      - name: Minify assets for production
        run: |
          set -euo pipefail
          cd wordpress-plugin/ai-layoff-tracker/assets
          for f in layoffs.js health.js widget.js; do
            [ -f "$f" ] || continue
            npx --yes terser@5 "$f" --compress --mangle -o "$f.min"
            node -e "new Function(require('fs').readFileSync('$f.min','utf8'))"
            mv "$f.min" "$f"
          done
          for f in layoffs.css widget.css; do
            [ -f "$f" ] || continue
            npx --yes clean-css-cli@5 -o "$f.min" "$f"
            [ -s "$f.min" ] || { echo "::error::clean-css produced empty $f"; exit 1; }
            mv "$f.min" "$f"
          done
          ls -la

      - name: Verify secrets are configured
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for var in FTP_HOST FTP_USER FTP_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Repo secret $var is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Verify target is the live plugin directory
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # HARDCODED path, relative to the FTP account home (2026-07-27). The
          # FTP account homes at the blog's WordPress root, so the live plugin
          # is at ./wp-content/plugins/ai-layoff-tracker. We used to read this
          # from the WP_PLUGIN_REMOTE_DIR secret + fall back to an absolute
          # /public_html path — BOTH were footguns: the absolute path failed the
          # wp-config guard (FTP home != /public_html), and a mis-pasted secret
          # (a 64-char hex string with no slashes) made the guard's "3 up" math
          # resolve to "." — so wp-config.php was found (guard passed) while the
          # mirror CREATED a stray ./<hex>/ folder and the real plugin was never
          # written. Hardcoding the known-correct relative path removes both.
          REMOTE_DIR: wp-content/plugins/ai-layoff-tracker
        run: |
          set -euo pipefail
          WP_ROOT="$(dirname "$(dirname "$(dirname "$REMOTE_DIR")")")"
          echo "Target plugin dir: $REMOTE_DIR"
          echo "Expected WordPress root: $WP_ROOT"
          # Two-part guard. (1) wp-config.php exists at WP_ROOT (real WP install).
          # (2) the plugin's OWN main file ALREADY exists at REMOTE_DIR — proves
          # we are OVERWRITING the installed plugin, not creating a stray folder
          # somewhere the mirror invented. This second check is the one that
          # would have caught the 2026-07-27 hex-dir incident.
          if ! timeout 60 lftp -c "
            set cmd:fail-exit true;
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 1;
            set net:timeout 15;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            cls -1 \"$WP_ROOT/wp-config.php\";
            cls -1 \"$REMOTE_DIR/ai-layoff-tracker.php\";
          "; then
            echo "::error::Guard failed — either no wp-config.php at $WP_ROOT, or no existing ai-layoff-tracker.php at $REMOTE_DIR. Refusing to deploy so files cannot land in the wrong folder."
            exit 1
          fi
          echo "Confirmed: wp-config.php + existing plugin present — target is the live plugin directory."

      - name: Deploy plugin over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Hardcoded (see guard step above for why the secret was dropped).
          REMOTE_DIR: wp-content/plugins/ai-layoff-tracker
        run: |
          set -euo pipefail
          # WordPress maintenance window around the upload. `mirror` overwrites
          # PHP files IN PLACE on the live site, so mid-upload a half-written or
          # mismatched file fatals WordPress and every visitor AND crawler gets a
          # raw HTTP 500. Proven 2026-07-28: the deploy ran 01:14:38-01:15:44 and
          # the live-API test recorded a 500 at 01:15:21, inside that window;
          # Google Search Console then reported "Server error (5xx)" for the site.
          #
          # Dropping WP's `.maintenance` file first turns that window into a
          # proper 503 + Retry-After ("briefly unavailable"), which crawlers are
          # designed to wait out and which never costs an index entry.
          #
          # The timestamp is a LITERAL, deliberately: WP ignores the file once
          # `$upgrading` is over 10 minutes old, so if this job dies mid-flight
          # the site un-maintenances itself. Writing `time()` instead would make
          # it permanently "now" and strand the site behind a 503 forever.
          printf '<?php $upgrading = %s; ?>' "$(date +%s)" > .maintenance
          # --- FTPS (default). For SFTP-over-SSH instead, replace the open line
          #     with:  open -u "$FTP_USER","$FTP_PASSWORD" "sftp://$FTP_HOST"
          #     and drop the three ftp:ssl* lines. ---
          timeout 180 lftp -c "
            set cmd:fail-exit true;
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 1;
            set net:timeout 15;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            put -O . .maintenance;
            mirror --reverse --delete --verbose \
              --exclude-glob .git* \
              --exclude-glob *.zip \
              wordpress-plugin/ai-layoff-tracker/ \"$REMOTE_DIR\";
            rm -f .maintenance;
          "
          echo "Deployed wordpress-plugin/ai-layoff-tracker/ to $REMOTE_DIR"

      # Belt and braces: if the mirror above failed partway, `.maintenance` is
      # still on the server. WP would clear it itself after 10 minutes, but do
      # not make the site wait that long for a failure we already know about.
      - name: Always clear the maintenance flag
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          timeout 60 lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 1;
            set net:timeout 15;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            rm -f .maintenance;
          " || echo "maintenance flag already clear (or unreachable); WP self-clears it after 10 minutes"

      - name: Verify the deployed tracker API
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
        run: |
          set -euo pipefail
          # A cache-busting public endpoint confirms that WordPress loaded the
          # newly uploaded plugin rather than merely serving cached HTML.
          # NOTE: this proves the ORIGIN is updated and nothing more. The query
          # string is a key no cache holds, so the origin always answers it. The
          # step below is the one that speaks for readers.
          curl --fail --show-error --silent --retry 4 --retry-all-errors \
            --retry-delay 5 --max-time 30 \
            -A 'AiLayoffTracker/1.0 (+https://asktherecruiter.com)' \
            "$WP_SITE_URL/wp-json/layoffs/v1/integrity-status?deploy_check=$GITHUB_RUN_ID" \
            | python3 -c 'import json, sys; payload = json.load(sys.stdin); assert "canonical_events" in payload; print("Live tracker API verified.")'

      # The check that measures the surface a reader actually gets: the BARE
      # url, a browser User-Agent, no cache buster. Every deploy check before
      # this one carried a query string and therefore measured the origin, which
      # is why a deploy could sit invisible to readers for 18 minutes (2026-08-05,
      # 2.19.274) with every check green. A deploy that has not reached readers
      # is not a finished deploy, so this fails the run rather than reporting it.
      - name: Verify the deploy has reached READERS
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
        run: |
          set -euo pipefail
          VERSION="$(grep -oE "define\('ALT_VERSION', '[0-9.]+'\)" \
            wordpress-plugin/ai-layoff-tracker/ai-layoff-tracker.php \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "Deployed ALT_VERSION: $VERSION"
          # Bounded by the page's own Cache-Control (s-maxage=60 over two chained
          # shared caches), with generous headroom so an edge that is slow to
          # expire is not reported as a stuck deploy.
          python3 railway/reader_freshness.py --wait-for "$VERSION" --timeout 600 --interval 15

      # And the check that measures what those bytes RENDER AS. The step above
      # proves readers have the new version; it cannot tell a readable page
      # from one whose paragraphs are 1.06:1 against their own background,
      # which is what shipped on 2026-08-10 with every check green. A deploy is
      # the moment a stylesheet change reaches readers, so this runs here as
      # well as on its own daily schedule.
      #
      # Exit 2 (a violation is LIVE) fails the deploy. Exit 3 (could not be
      # measured at all) does NOT, and that asymmetry is deliberate: this repo
      # has already learned that letting a host outage manufacture red runs
      # manufactures alerts that also fail (CLAUDE.md, /alert). An UNKNOWN here
      # is loud in the log and is caught within the day by the scheduled
      # Rendered contrast audit, which DOES go red on it.
      - name: Verify the deployed page is readable in both themes
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
        run: |
          set -uo pipefail
          python3 railway/contrast_audit.py \
            --url "$WP_SITE_URL/ai-layoff-tracker/" --json contrast.json
          STATUS=$?
          if [ "$STATUS" = "2" ]; then
            echo "::error::Text below WCAG AA is live on the tracker page."
            exit 1
          fi
          if [ "$STATUS" = "3" ]; then
            echo "::warning::Rendered contrast could NOT be measured. This is \
UNKNOWN, not a pass; the daily Rendered contrast audit will go red if it \
persists."
          fi
          exit 0
