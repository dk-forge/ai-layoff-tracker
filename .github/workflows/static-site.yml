name: Static site (build only)

on:
  pull_request:
    paths:
      - 'railway/static_site.py'
      - 'railway/static_data.py'
      - 'railway/static_preview.py'
      - 'railway/tests/test_static_preview.py'
      - 'railway/backup_state.json'
      - 'railway/backup_tables.py'
      - 'railway/tests/test_static_data.py'
      - 'railway/tests/test_tracker.mjs'
      - 'railway/static_site_assets/**'
      - 'railway/tests/test_static_site.py'
      - 'static-site/data/**'
      - '.github/workflows/static-site.yml'
  push:
    branches: [main]
    paths:
      - 'static-site/data/**'
      - 'railway/backup_state.json'
  workflow_run:
    workflows: ['Weekly off-host backup']
    types: [completed]
  workflow_dispatch:
    inputs:
      snapshot_build:
        description: 'Build a complete captured snapshot, which must already exist in the repo'
        type: boolean
        default: false
      backup_tag:
        description: 'Build a data artifact from this public backup tag, or leave blank to build the site snapshot'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test the offline build contract
        working-directory: railway
        run: python -m unittest tests.test_static_site tests.test_static_data tests.test_static_preview -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test tracker filtering and charts
        run: node --test railway/tests/test_tracker.mjs

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot_build && inputs.backup_tag == ''
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the actual public snapshot
        run: python railway/static_site.py --snapshot static-site/data/manifest.json --out dist
      - name: Keep build output for review
        uses: actions/upload-artifact@v4
        with:
          name: alt-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  data:
    if: github.event_name == 'workflow_dispatch' && inputs.backup_tag != ''
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download a specific public backup release
        env:
          BACKUP_TAG: ${{ inputs.backup_tag }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_TAG" =~ ^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          mkdir backup-input
          for file in manifest.json layoffs.jsonl.gz events.jsonl.gz source_reports.jsonl.gz; do
            curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
              --max-time 120 --output "backup-input/$file" \
              "https://github.com/dk-forge/ai-layoff-tracker/releases/download/$BACKUP_TAG/$file"
          done
      - name: Validate and project the public data
        run: python railway/static_data.py --backup backup-input --out static-data/tracker-data.json
      - uses: actions/upload-artifact@v4
        with:
          name: alt-static-data
          path: static-data/tracker-data.json
          if-no-files-found: error
          retention-days: 7

  preview:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build a non-indexable public-backup preview
        run: python railway/static_preview.py --state railway/backup_state.json --out dist
      - name: Keep build output for review
        uses: actions/upload-artifact@v4
        with:
          name: alt-static-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
