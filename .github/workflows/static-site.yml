name: Static site (build only)

on:
  pull_request:
    paths:
      - 'railway/static_site.py'
      - 'railway/static_site_assets/**'
      - 'railway/tests/test_static_site.py'
      - 'static-site/data/**'
      - '.github/workflows/static-site.yml'
  push:
    branches: [main]
    paths:
      - 'static-site/data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test the offline build contract
        working-directory: railway
        run: python -m unittest tests.test_static_site -v

  build:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the actual public snapshot
        run: python railway/static_site.py --snapshot static-site/data/manifest.json --out dist
      - name: Keep build output for review
        uses: actions/upload-artifact@v4
        with:
          name: alt-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
