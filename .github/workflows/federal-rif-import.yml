name: Federal RIF import (OPM EHRI)

# Pulls US federal executed Reduction-in-Force separations from OPM's EHRI
# open data (keyless), filters to category SH (RIF), groups by agency + effective
# month, and posts via the bulk endpoint (no LLM). Idempotent. OPM publishes
# monthly with a lag, so this runs monthly + on manual dispatch.
# Required secret: WP_API_KEY. pyarrow/pandas installed here only (kept out of
# the shared requirements so the daily jobs stay lean).
#
# OPM files are INCREMENTAL reporting batches, so a month's true total is the SUM
# of its slices across every file. The run therefore reads the WHOLE window
# (FEDERAL_RIF_SINCE, default 2024-01 => ~30 files, ~26MB) and recomputes every
# agency-month from scratch; the dedup hash excludes the count, so revisions and
# late-reported rows upsert in place. Reading only the newest file is the
# 2026-08-16 defect that put effective-year 2025 at 47 separations against a
# true 10,739 — see railway/tests/test_federal_rif.py.
#
# BACKFILL: dispatch with `since` = 2005-01 to read all 258 files (~200MB, slow
# but free). Anything earlier than 2015 is dropped by the collector's own date
# guard.

on:
  schedule:
    - cron: '0 14 6 * *'   # 6th of the month, ~after OPM's monthly publish
  workflow_dispatch:
    inputs:
      since:
        description: 'Earliest OPM reporting file to read, YYYY-MM (default 2024-01; use 2005-01 for a full backfill)'
        required: false
        default: ''

jobs:
  federal-rif:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Verify secret
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: '[ -n "$WP_API_KEY" ] || { echo "::error::WP_API_KEY not set."; exit 1; }'
      - name: Install deps
        working-directory: railway
        run: |
          pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run federal RIF import
        working-directory: railway
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          FEDERAL_RIF_SINCE: ${{ inputs.since }}
        run: python federal_rif_import.py
