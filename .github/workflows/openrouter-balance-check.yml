name: OpenRouter low-balance alert

# Daily read of the OpenRouter account balance + this key's remaining cap.
# Emails the owner (via the keyed /alert endpoint) while either is below the
# threshold, so the LLM pipeline never silently stalls on an empty balance
# again. Read-only, no LLM calls, ~0 cost. Never fails the run: a monitoring
# job must not page about its own hiccup.

on:
  schedule:
    - cron: '0 13 * * *'   # daily, 9 AM ET
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Alert when balance/cap drops below this many USD'
        required: false
        default: '10'
      runway:
        description: 'Alert when fewer than this many days of credit remain'
        required: false
        default: '10'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check OpenRouter balance
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          ALERT_THRESHOLD: ${{ github.event.inputs.threshold || '10' }}
          ALERT_RUNWAY_DAYS: ${{ github.event.inputs.runway || '10' }}
        run: python openrouter_balance_check.py

      # The runway alert is only as good as its history, and a workflow that
      # writes a file without committing it has recorded nothing. The reading
      # is one line a day and the alert is worthless without the slope.
      - name: Commit today's balance reading
        if: ${{ !cancelled() }}
        run: |
          git config user.name  'layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add railway/openrouter_balance_history.json || true
          if git diff --staged --quiet; then
            echo "No new reading to commit."
            exit 0
          fi
          git commit -q -m "chore: openrouter balance reading $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then echo "Pushed on attempt $attempt."; exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          # Deliberately not a failure. A monitoring job that reddens CI
          # because it could not push its own bookkeeping is noise, and the
          # alert for THIS run has already been sent either way.
          echo "::warning::could not push the balance reading after 3 attempts"
