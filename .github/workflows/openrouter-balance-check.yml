name: OpenRouter low-balance alert

# Daily read of the OpenRouter account balance + this key's remaining cap.
# Emails the owner (via the keyed /alert endpoint) while either is below the
# threshold, so the LLM pipeline never silently stalls on an empty balance
# again. Read-only, no LLM calls, ~0 cost. Never fails the run: a monitoring
# job must not page about its own hiccup.

# The default GITHUB_TOKEN here is READ-ONLY: without this block the final
# "commit today's reading" step 403s on push, the step swallows the failure
# by design (a monitoring job must not redden CI over its own bookkeeping),
# and the spend ledger silently never lands on main. That is exactly what
# happened 2026-08-02/03: harvest read the logs fine, found the ledger line,
# and every push was denied. contents:write fixes the push; actions:read must
# be listed explicitly because an explicit permissions block REPLACES the
# defaults, and --harvest reads the day's run logs with github.token.
permissions:
  contents: write   # push the daily reading + harvested spend_jobs.json
  actions: read     # spend.py --harvest lists runs and reads their logs

on:
  schedule:
    - cron: '0 13 * * *'   # daily, 9 AM ET
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Alert when balance/cap drops below this many USD'
        required: false
        default: '10'
      runway:
        description: 'Alert when fewer than this many days of credit remain'
        required: false
        default: '10'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Check OpenRouter balance
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          ALERT_THRESHOLD: ${{ github.event.inputs.threshold || '10' }}
          ALERT_RUNWAY_DAYS: ${{ github.event.inputs.runway || '10' }}
        run: python openrouter_balance_check.py

      # This job OWNS the month-start snapshot that railway/spend.py measures
      # month-to-date against. Every other workflow reads the committed file;
      # only this one persists it, because only a committed snapshot survives
      # an ephemeral runner. `--degrade` here is a no-op for this job (it makes
      # no paid calls) and is run purely to take the reading.
      - name: Take the month-start spend snapshot
        if: ${{ !cancelled() }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade

      # Per-job attribution: every LLM job prints one SPEND_LEDGER_V1 line
      # (job, date, exact metered cost, items, stored/changed). Runners are
      # ephemeral, so this step re-reads those lines out of the day's run
      # logs into the committed railway/spend_jobs.json — ONE commit a day
      # here, instead of one push per job (which would rebuild Railway and
      # re-run the test suite a dozen times daily). Never fails the run.
      - name: Harvest per-job spend ledger lines from run logs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          # The Railway cron cannot commit or be log-harvested, so it posts
          # each run's metered spend to the keyed /tracker-meta endpoint;
          # --harvest reads those records back into the same committed ledger
          # (job id railway-cron). Without these two, the railway rows are
          # reported UNKNOWN for the day, never silently skipped.
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: python railway/spend.py --harvest

      # The runway alert is only as good as its history, and a workflow that
      # writes a file without committing it has recorded nothing. The reading
      # is one line a day and the alert is worthless without the slope.
      - name: Commit today's balance reading
        if: ${{ !cancelled() }}
        run: |
          git config user.name  'layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add railway/openrouter_balance_history.json railway/spend_month.json railway/spend_jobs.json || true
          if git diff --staged --quiet; then
            echo "No new reading to commit."
            exit 0
          fi
          git commit -q -m "chore: openrouter balance reading $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then echo "Pushed on attempt $attempt."; exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          # Deliberately not a failure. A monitoring job that reddens CI
          # because it could not push its own bookkeeping is noise, and the
          # alert for THIS run has already been sent either way.
          echo "::warning::could not push the balance reading after 3 attempts"
