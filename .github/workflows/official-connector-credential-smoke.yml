name: Official connector credential smoke tests

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify configured keys with read-only official requests
        env:
          EDINET_API_KEY_JP: ${{ secrets.EDINET_API_KEY_JP }}
          OPENDART_API_KEY_KR: ${{ secrets.OPENDART_API_KEY_KR }}
          COMPANIES_HOUSE_API_KEY_UK: ${{ secrets.COMPANIES_HOUSE_API_KEY_UK }}
        run: |
          set -euo pipefail
          test -n "$EDINET_API_KEY_JP"
          test -n "$OPENDART_API_KEY_KR"
          test -n "$COMPANIES_HOUSE_API_KEY_UK"

          # Official EDINET list metadata only; no document is downloaded.
          curl --fail --silent --show-error --get \
            --data-urlencode "Subscription-Key=$EDINET_API_KEY_JP" \
            --data-urlencode 'date=2026-07-01' \
            --data-urlencode 'type=2' \
            'https://api.edinet-fsa.go.jp/api/v2/documents.json' >/dev/null

          # OpenDART can return status 013 for an empty date. Keep the
          # response out of logs and accept only successful/empty statuses.
          dart_status="$(curl --fail --silent --show-error --get \
            --data-urlencode "crtfc_key=$OPENDART_API_KEY_KR" \
            --data-urlencode 'bgn_de=20260701' \
            --data-urlencode 'end_de=20260701' \
            'https://opendart.fss.or.kr/api/list.json' | jq -r '.status // empty')"
          case "$dart_status" in
            000|013) ;;
            *)
              echo 'OpenDART credential smoke test did not receive a successful status.' >&2
              exit 1
              ;;
          esac

          # Read-only Companies House record request with Basic API-key auth.
          curl --fail --silent --show-error \
            -u "$COMPANIES_HOUSE_API_KEY_UK:" \
            'https://api.company-information.service.gov.uk/company/00000006' >/dev/null
          echo 'All configured official-source credentials accepted read-only smoke tests.'
