name: Company watchlist sweep

# Automated "work backwards from the big employers": each run checks a rotating
# slice of the watchlist against our own data and, for any big company we have
# no current-year entry for, fires a company-targeted news query, extracts via
# DeepSeek, and adds the verified layoff. Runs on our own NewsAPI net (Reuters/
# Bloomberg/FT cover big European cuts in English), NOT any metered web-search.
# Daily with rotation → each company revisited ~weekly; fresh cuts surface in a day.
#
# Required secrets: NEWSAPI_KEY, OPENROUTER_API_KEY, WP_API_KEY

on:
  schedule:
    - cron: '35 15 * * *'   # 11:35 AM ET — after the morning ingest + dedup settle
  workflow_dispatch:
    inputs:
      batch:
        description: 'Companies checked this run (default 60)'
        required: false
        default: '60'
      dry_run:
        description: 'Set to 1 to log candidates without posting'
        required: false
        default: ''
      news_budget:
        description: 'Company-targeted NewsAPI requests this run may send (default 40). The key allows 100/day for the WHOLE tracker.'
        required: false
        default: ''
      # WHY THIS IS A DISPATCH INPUT AND NOT AN EDIT TO THE NAMED TABLE.
      # `spend.JOB_RUN_CEILINGS_USD['company-watchlist']` is $0.030, and since
      # 2026-08-11 that ceiling genuinely binds mid-run rather than being a
      # label a report compared against. Every priced run of this job has
      # stopped on it. Raising it in the table would raise it for every
      # scheduled run forever; putting it here raises it for ONE dispatch, and
      # `spend.effective_run_ceiling_usd()` already gives an explicit
      # ALT_RUN_CEILING_USD precedence over the table. Blank = $0.030.
      run_ceiling_usd:
        description: 'Per-run spend ceiling in USD for THIS dispatch only. Blank = the named $0.030.'
        required: false
        default: ''

jobs:
  watchlist:
    runs-on: ubuntu-latest
    # Sized from measurement, 2026-08-05: median 18.5 min, max 47.0 over
    # the last 15 runs. 47 was 85% of the old 55 ceiling - the next
    # self-timeout waiting. ~2x the max and ~5x the median: 90.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Verify secrets
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          missing=0
          for v in NEWSAPI_KEY OPENROUTER_API_KEY WP_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set."; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Add the missing secret(s) and re-run."; exit 1; }
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run watchlist sweep
        working-directory: railway
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          WATCHLIST_BATCH: ${{ github.event.inputs.batch || '150' }}  # 60 -> 150 (2026-07-28): per-company checks are free API reads; 60/day meant a 157-day rotation over the 9,397-company universe
          WATCHLIST_DRY_RUN: ${{ github.event.inputs.dry_run }}
          WATCHLIST_DEADLINE_SECONDS: '1500'
          WATCHLIST_NEWS_BUDGET: ${{ github.event.inputs.news_budget }}
          ALT_RUN_CEILING_USD: ${{ github.event.inputs.run_ceiling_usd }}
        run: |
          # A blank input must be ABSENT, not empty: company_watchlist.py reads
          # WATCHLIST_NEWS_BUDGET through int(... or 0) and the spend module
          # should never see an unparseable ceiling at all.
          for v in WATCHLIST_NEWS_BUDGET ALT_RUN_CEILING_USD; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "${ALT_RUN_CEILING_USD:-}" ]; then
            echo "::notice::per-run ceiling overridden to \$${ALT_RUN_CEILING_USD} for THIS dispatch only (named ceiling \$0.030); the schedule is unchanged"
          fi
          python company_watchlist.py
