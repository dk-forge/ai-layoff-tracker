name: Historical global news sweep

# One rotating SEVEN-day window per RUN (historical_news_sweep.WINDOW_DAYS = 7 —
# this header said "14-day window per day" until 2026-07-30 and was wrong on both
# counts). Eventually covers the complete GDELT-era history without repeatedly
# rescanning every prior year. The per-run ceiling on model candidates is
# BACKFILL_MAX_ARTICLES below, currently **10** — not the 500 this header used to
# claim from GDELT's own 250-per-request cap, which stopped being the binding
# limit once the cap was set. It is intentionally separate from the live feed and
# safe to pause by disabling this workflow.
on:
  schedule:
    # HOURLY, DELIBERATELY — audited 2026-07-30 and kept, unlike its two sibling
    # sprints (edgar-history-sweep, archive-backfill), both of which were reverted
    # the same day because hourly bought them nothing. The difference is where the
    # cursor lives. This job's cursor is SERVER-side and success-anchored
    # (`/historical-gdelt-cursor`), so it advances one window per RUN and cadence
    # maps 1:1 to progress — proven in the logs: the 00:00Z run took
    # 2019-07-21..27 and the 01:05Z run took 2019-07-28..08-03. edgar's cursor is
    # `now.toordinal() % len(months)`, i.e. keyed on the calendar DATE, so its
    # 22 runs/day all swept the identical window.
    #
    # Remaining work at 2026-08-02: cursor 2021-02-14, so ~1,996 days = ~285
    # windows left. At the daily cadence below that is ~285 days; the hourly
    # sprint would have closed it in ~12. Cost is bounded by
    # BACKFILL_MAX_ARTICLES=10, so <=10 extraction calls/day now, well under a
    # cent — but see the cadence note: the reason to slow it down was never the
    # cost per call, it was the rows per call.
    #
    # The 2026-07-28 industry-drain postmortem's warning that "self-limiting when
    # empty" is FALSE does NOT apply here. That warning is about rows whose two
    # classifier passes disagree and write no marker, so they re-queue forever.
    # This cursor is monotonic and persisted: a completed window is never
    # revisited, and when it reaches today every run really is a no-op.
    #
    # THEN revert to '40 5 * * *'. Check with:
    #   curl -s .../wp-json/layoffs/v1/historical-gdelt-cursor  (keyed)
    # or just read `Success-anchored historical GDELT window:` in the newest run.
    # REVERTED TO DAILY 2026-08-02, on yield the sprint header never had.
    # Twelve consecutive hourly runs were read: 120 model extractions produced
    # ONE stored row (0.83%). The remaining ~285 windows are therefore ~2,850
    # extractions for an expected ~24 rows, and on 2026-08-02 the OpenRouter
    # ACCOUNT was at $22.92 falling ~$7/day, i.e. about three days of runway for
    # BOTH trackers. Buying a year of thin history with the credit that keeps
    # live collection alive is the wrong trade at that balance.
    #
    # Nothing about the design was wrong: the cursor really is server-side and
    # success-anchored, cadence really does map 1:1 to progress, and the header's
    # ~$0.18/day estimate is about right. It is the VALUE per call that is poor,
    # which only shows up once you count stored rows per extraction.
    #
    # Re-arm the hourly sprint when the account is funded and the yield justifies
    # it. Check yield first, not just cost:
    #   gh run list --workflow=historical-news-sweep.yml -L 12 --json databaseId \
    #     -q '.[].databaseId' | xargs -I{} gh run view {} --log \
    #     | grep -oE 'GDELT backfill complete: [0-9]+ posted'
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Optional override start date YYYY-MM-DD'
        required: false
        default: ''
      end:
        # Was "max 14 days after start" and that input CRASHED the run:
        # historical_news_sweep raises unless (end - start) < WINDOW_DAYS = 7, so
        # start+7 and anything above it is a RuntimeError, and the documented
        # maximum was twice the real one. Pinned by test_rotating_cron_cadence.
        description: 'Optional override end date YYYY-MM-DD (max 6 days after start)'
        required: false
        default: ''

# Hourly sprint safety: a run that outlives the hour must NOT overlap the
# next one - two walkers racing the same cursor window would double-spend
# LLM calls on the same articles (dedup keeps the DATA clean, not the bill).
concurrency:
  group: historical-news-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Sized from measurement, 2026-08-28: the 20 most recent scheduled runs all
    # finished in 1.4-2.2 minutes. The one run that ever hit this ceiling
    # (2026-08-27, run 33094996142) was not the corpus outgrowing 45 minutes:
    # api.gdeltproject.org went dark and every planned sweep plus the pending
    # retries ground through the full 6-attempt/90s-backoff schedule against a
    # dead API (up to ~18 min per abandoned sweep, ~16 slots planned). That is
    # now bounded at the source: sources/gdelt.py trips an outage breaker after
    # the FIRST abandoned sweep, queues the rest in the work ledger, and lets
    # the run finish (worst case ~1 abandoned sweep + BQ broad + the 600s
    # extraction deadline, ~30 min). 45 keeps >30% headroom over that worst
    # case and stays the last-resort backstop, never the thing that ends a run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses.
          #
          # Only the FULL lock is cached. The min-lock jobs deliberately have
          # no cache: measured 2026-08-19, a 130 MB restore made their 4-second
          # install about 5 seconds SLOWER, and setup-python's prefix
          # restore-key meant they pulled this heavy cache anyway. RUNBOOK,
          # "Runner minutes". Do not add it back.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Install dependencies
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Ingest and deduplicate the selected global window
        working-directory: railway
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          GCP_BIGQUERY_CREDENTIALS_JSON: ${{ secrets.GCP_BIGQUERY_CREDENTIALS_JSON }}
          GDELT_PREFER_BQ: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          # Bounds DeepSeek work and wall time. Manual historical backfills
          # remain uncapped unless their operator explicitly sets a limit.
          # Ten source articles per run keeps a worst-case timeout bounded;
          # the rotating schedule makes steady, autonomous historical progress.
          BACKFILL_MAX_ARTICLES: '10'
          # Historical windows fight GDELT's shared-endpoint throttling far
          # more than live pulls; be maximally patient rather than abandoning
          # a window (2026-07-18: three targeted June windows were lost to
          # 429s at the default patience).
          GDELT_QUERY_ATTEMPTS: '6'
          GDELT_QUERY_BACKOFF_SECONDS: '90'
          OPENROUTER_TIMEOUT_SECONDS: '45'
          BACKFILL_DEADLINE_SECONDS: '600'
          HISTORICAL_START_OVERRIDE: ${{ github.event.inputs.start || '' }}
          HISTORICAL_END_OVERRIDE: ${{ github.event.inputs.end || '' }}
        run: |
          python historical_news_sweep.py
