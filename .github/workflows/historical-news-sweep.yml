name: Historical global news sweep

# One rotating SEVEN-day window per RUN (historical_news_sweep.WINDOW_DAYS = 7 —
# this header said "14-day window per day" until 2026-07-30 and was wrong on both
# counts). Eventually covers the complete GDELT-era history without repeatedly
# rescanning every prior year. The per-run ceiling on model candidates is
# BACKFILL_MAX_ARTICLES below, currently **10** — not the 500 this header used to
# claim from GDELT's own 250-per-request cap, which stopped being the binding
# limit once the cap was set. It is intentionally separate from the live feed and
# safe to pause by disabling this workflow.
on:
  schedule:
    # HOURLY, DELIBERATELY — audited 2026-07-30 and kept, unlike its two sibling
    # sprints (edgar-history-sweep, archive-backfill), both of which were reverted
    # the same day because hourly bought them nothing. The difference is where the
    # cursor lives. This job's cursor is SERVER-side and success-anchored
    # (`/historical-gdelt-cursor`), so it advances one window per RUN and cadence
    # maps 1:1 to progress — proven in the logs: the 00:00Z run took
    # 2019-07-21..27 and the 01:05Z run took 2019-07-28..08-03. edgar's cursor is
    # `now.toordinal() % len(months)`, i.e. keyed on the calendar DATE, so its
    # 22 runs/day all swept the identical window.
    #
    # Remaining work at 2026-07-30: cursor 2019-08-04, so 2,552 days = 365
    # windows left. At ~22 runs/day that closes in ~17 days; at one/day it is
    # ~365 days. Cost is bounded by BACKFILL_MAX_ARTICLES=10, so <=230 extraction
    # calls/day, ~$0.18/day — buying a year of history closure for pennies.
    #
    # The 2026-07-28 industry-drain postmortem's warning that "self-limiting when
    # empty" is FALSE does NOT apply here. That warning is about rows whose two
    # classifier passes disagree and write no marker, so they re-queue forever.
    # This cursor is monotonic and persisted: a completed window is never
    # revisited, and when it reaches today every run really is a no-op.
    #
    # THEN revert to '40 5 * * *'. Check with:
    #   curl -s .../wp-json/layoffs/v1/historical-gdelt-cursor  (keyed)
    # or just read `Success-anchored historical GDELT window:` in the newest run.
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Optional override start date YYYY-MM-DD'
        required: false
        default: ''
      end:
        # Was "max 14 days after start" and that input CRASHED the run:
        # historical_news_sweep raises unless (end - start) < WINDOW_DAYS = 7, so
        # start+7 and anything above it is a RuntimeError, and the documented
        # maximum was twice the real one. Pinned by test_rotating_cron_cadence.
        description: 'Optional override end date YYYY-MM-DD (max 6 days after start)'
        required: false
        default: ''

# Hourly sprint safety: a run that outlives the hour must NOT overlap the
# next one - two walkers racing the same cursor window would double-spend
# LLM calls on the same articles (dedup keeps the DATA clean, not the bill).
concurrency:
  group: historical-news-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: railway
        run: pip install -r requirements.txt
      - name: Ingest and deduplicate the selected global window
        working-directory: railway
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          GCP_BIGQUERY_CREDENTIALS_JSON: ${{ secrets.GCP_BIGQUERY_CREDENTIALS_JSON }}
          GDELT_PREFER_BQ: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          # Bounds DeepSeek work and wall time. Manual historical backfills
          # remain uncapped unless their operator explicitly sets a limit.
          # Ten source articles per run keeps a worst-case timeout bounded;
          # the rotating schedule makes steady, autonomous historical progress.
          BACKFILL_MAX_ARTICLES: '10'
          # Historical windows fight GDELT's shared-endpoint throttling far
          # more than live pulls; be maximally patient rather than abandoning
          # a window (2026-07-18: three targeted June windows were lost to
          # 429s at the default patience).
          GDELT_QUERY_ATTEMPTS: '6'
          GDELT_QUERY_BACKOFF_SECONDS: '90'
          OPENROUTER_TIMEOUT_SECONDS: '45'
          BACKFILL_DEADLINE_SECONDS: '600'
          HISTORICAL_START_OVERRIDE: ${{ github.event.inputs.start || '' }}
          HISTORICAL_END_OVERRIDE: ${{ github.event.inputs.end || '' }}
        run: |
          python historical_news_sweep.py
