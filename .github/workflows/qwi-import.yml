name: Census QWI reference data

# Census Data API, timeseries/qwi/{sa,se,rh}: six requests (state x NAICS
# sector, and state x age, sex, education, race, ethnicity), hires, separations
# and end-of-quarter employment, latest 8 quarters -> /reference-ingest/
# census_qwi. LABELED MACRO CONTEXT: separations are all causes, never summed
# into layoff counts and not read by ingest or classification. Needs the
# CENSUS_API_KEY secret, passed only through env and never printed. QWI is
# quarterly; weekly collection keeps the freshness alarm tight. Fail-soft.
# Freshness: reference-freshness.yml. History: qwi-archive.yml.

on:
  schedule:
    - cron: '55 14 * * 2'   # Tuesdays
  workflow_dispatch:

permissions:
  contents: write   # commit the deferral ledger, and only when it changed

concurrency:
  group: qwi-import

jobs:
  qwi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Fetch + store Census QWI reference data
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python qwi_import.py

      - name: Record the deferral ledger
        if: ${{ always() }}
        uses: ./.github/actions/commit-deferral-ledger
        with:
          job: qwi-import
