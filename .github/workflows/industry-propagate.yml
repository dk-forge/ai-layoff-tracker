name: Industry propagate (deterministic)

# Fills blank-industry rows from the SAME company's already-known label. No LLM,
# no cost, no guessing — a company whose tagged rows disagree is skipped. Writes
# through the /industry-backfill endpoint, so it inherits blank-only + closed-
# vocabulary validation. Complements the LLM classifier, which handles the rows
# that have no tagged sibling to learn from.
# Weekly + manual; required secret: WP_API_KEY.

on:
  schedule:
    # DAILY, not weekly: 45% of US-2026 job volume still carries no industry
    # label, which mechanically caps every sector figure we report. This pass is
    # deterministic (it reuses a label the SAME company already carries on
    # another row), so it costs no model calls and can safely run every day
    # alongside the bounded LLM backfill.
    - cron: '20 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set 1 to print what would be filled without writing'
        required: false
        default: ''
      max_rows:
        description: 'Cap rows written this run (default 5000)'
        required: false
        default: ''

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run industry propagation
        working-directory: railway
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          INDUSTRY_PROPAGATE_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
          INDUSTRY_PROPAGATE_MAX: ${{ github.event.inputs.max_rows || '' }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            python industry_propagate.py | tee -a "$GITHUB_STEP_SUMMARY" && exit 0
            echo "::warning::attempt $attempt failed; auto-retrying in $((attempt*45))s"
            sleep $((attempt*45))
          done
          echo "::error::still failing after 3 attempts"
          exit 1
