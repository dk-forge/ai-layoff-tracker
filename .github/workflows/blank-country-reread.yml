name: Blank-country source re-read

# Manual and bounded. Re-reads the source BODY of every row that carries no
# job-location country, and fills `country` only where the body states where
# the cut jobs were, with an exact quote. A source that does not say leaves the
# row blank, which is the correct outcome for most of this backlog.
#
# DRY RUN IS THE DEFAULT, and a write needs the ROW IDS spelled out. On
# 2026-08-19 an apply-everything run wrote three rows and two were wrong -
# Zepz placed in Kenya from a Kenya-and-Poland closure, Cineverse placed in
# India from a total-headcount breakdown - and both passed every automatic
# check that existed at the time. A write goes through /edit, which sets
# edited=1, rewrites the dedup hash and publishes the claim. So: dry-run,
# read each quote in the summary, then name the ids you accept.
on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: 'Blank-country rows to examine'
        required: false
        default: '200'
      apply_ids:
        description: 'Comma-separated row ids to WRITE, after reading each quote in a dry run. Empty = dry run.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). Past the month's allowance it sets
      # ALT_PAID_READS=off, and extract_job_location_evidence then returns the
      # "retry later" value per row. A budget stop is UNDECIDED, never a
      # verdict, and never a red run. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses.
          #
          # Only the FULL lock is cached. The min-lock jobs deliberately have
          # no cache: measured 2026-08-19, a 130 MB restore made their 4-second
          # install about 5 seconds SLOWER, and setup-python's prefix
          # restore-key meant they pulled this heavy cache anyway. RUNBOOK,
          # "Runner minutes". Do not add it back.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      # The full lock: this imports enrich_context for its fetch + Wayback
      # fallback, which reaches google-cloud-bigquery for the alternate-source
      # finder.
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Re-read blank-country sources
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd railway
          python blank_country_reread.py \
            --max "${{ github.event.inputs.max_rows || '200' }}" \
            ${{ github.event.inputs.apply_ids != '' && format('--apply --ids {0}', github.event.inputs.apply_ids) || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -eo pipefail {0}
