name: Sandbox token probe

# ONE-OFF, manual only. Before the sandbox's watchdogs are hosted from this
# repo, prove which GitHub API doors MERGE_TRAIN_TOKEN (a fine-grained PAT)
# can open on dk-forge/asktherecruiter-sandbox. Every call is a read or an
# idempotent, reversible write (a probe label created and deleted; a
# workflow enabled that is already enabled). No secret value is printed. It
# never dispatches, re-runs, comments or pushes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: Which sandbox endpoints answer the token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe each endpoint the watchdogs use
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN }}
          R: dk-forge/asktherecruiter-sandbox
          SHA: 7e15843e1e1fb153c9adfbea291b2d183012e97d
          RUN: "35714806623"
          PR: "1098"
        run: |
          set +e
          try() { # label, then the command
            local label="$1"; shift
            out=$("$@" 2>&1); code=$?
            if [ $code -eq 0 ]; then echo "OK    $label"; else echo "FAIL  $label :: $(echo "$out" | head -c 200 | tr '\n' ' ')"; fi
          }
          try "gh pr list (GraphQL, pulls read)"          gh pr list -R "$R" --state open -L 5 --json number,mergeable,headRefOid,labels,isDraft
          try "pulls?state=closed"                         gh api "repos/$R/pulls?state=closed&per_page=2"
          try "commits/SHA/check-runs (Checks: read)"      gh api "repos/$R/commits/$SHA/check-runs?per_page=5"
          try "commits/SHA/status (statuses read)"         gh api "repos/$R/commits/$SHA/status"
          try "actions/runs?head_sha"                      gh api "repos/$R/actions/runs?head_sha=$SHA&per_page=5"
          try "actions/runs?status=queued"                 gh api "repos/$R/actions/runs?status=queued&per_page=5"
          try "actions/runs/ID/jobs"                       gh api "repos/$R/actions/runs/$RUN/jobs?per_page=5"
          try "actions/workflows"                          gh api "repos/$R/actions/workflows?per_page=100"
          try "actions/workflows/FILE/runs"                gh api "repos/$R/actions/workflows/merge-train.yml/runs?per_page=2"
          try "gh run view --log-failed"                   gh run view "$RUN" -R "$R" --log-failed
          try "actions/runners (admin read)"               gh api "repos/$R/actions/runners?per_page=5"
          try "issues/N/comments (read)"                   gh api "repos/$R/issues/$PR/comments?per_page=5"
          try "gh issue list --search"                     gh issue list -R "$R" --state open --search 'in:body "<!-- train-watchdog:running-issue -->"' --json number
          try "gh label create --force (Issues: write)"    gh label create watchdog-token-probe -R "$R" --force --color EEEEEE --description "token probe, deleted by the same run"
          try "gh label delete (Issues: write)"            gh label delete watchdog-token-probe -R "$R" --yes
          try "gh workflow enable (Actions: write)"        gh workflow enable train-watchdog.yml -R "$R"
          try "gh workflow list"                           gh workflow list -R "$R"
          try "contents/VERSION (Contents: read)"          gh api "repos/$R/contents/VERSION"
          exit 0
