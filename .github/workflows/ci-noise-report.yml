# One weekly email naming the week's CI noise, or no email at all.
#
# The per-failure alerting already exists (ci-alert.yml, deduped by cause,
# held in railway/alert_outbox.json when the host is down). This is the layer
# above it: did the week produce runs that went red for causes already
# reported (repeat reds), or runs that ended cancelled with zero jobs (a
# concurrency slot displaced them and the UI shows nothing)? Those are the
# two shapes of noise this repo and its sibling have measured. A quiet week
# posts NOTHING — the owner's inbox is quiet exactly when nothing needs him.
#
# Category-(a) failures are untouched: a real breakage still reddens once and
# emails once through ci-alert.yml; the first red of each cause counts ZERO
# here. This job never silences anything and never softens an exit code.
name: CI noise report

on:
  schedule:
    # Mondays 12:20 UTC, just after the 12:00 health digest, so the owner's
    # Monday reading is one sitting. Minute collides with nothing.
    - cron: '20 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = print the report, post nothing'
        default: 'true'

permissions:
  contents: write   # hold an undeliverable alert in railway/alert_outbox.json
  actions: read     # read run history and failed-run logs

concurrency:
  group: ci-noise-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The alarm's claim is a commit (railway/alert_state.json), so the
      # committer has to exist before the reporter runs.
      - name: Identify the committer
        run: |
          git config user.name  'ai-layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'

      # No pip install: railway/ci_noise_report.py is stdlib-only, like
      # ci_alert.py — a reporting path must not be breakable by a dependency
      # resolution failure.
      - name: Count the week's noise, mail once only if there is any
        env:
          # It mails through ci_alert.post_alert, so it moved with it: Resend
          # for the send, railway/alert_state.json for the cause key.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_MAIL_FROM: ${{ vars.OPS_MAIL_FROM }}
          OPS_MAIL_TO: ${{ vars.OPS_MAIL_TO }}
          ALERT_STATE_COMMIT: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_ENVELOPE: ${{ runner.temp }}/undelivered_alert.json
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python3 railway/ci_noise_report.py $EXTRA

      # Same held-alert dance as ci-alert.yml, and it survives the move to
      # Resend for the same reason it was built: a relay can be down too. An
      # undeliverable alert is
      # HELD, never lost and never a red run of its own; alert-drain.yml
      # delivers the outbox every 30 minutes.
      - name: Hold the alert until the relay is back
        if: ${{ !cancelled() }}
        env:
          ALERT_ENVELOPE: ${{ runner.temp }}/undelivered_alert.json
        run: |
          set -euo pipefail
          if [ ! -f "$ALERT_ENVELOPE" ]; then
            echo "Nothing to hold."
            exit 0
          fi
          git config user.name  'ai-layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 railway/alert_outbox.py enqueue --envelope "$ALERT_ENVELOPE"
            git add railway/alert_outbox.json
            if git diff --staged --quiet; then
              echo "Already held by another run."
              exit 0
            fi
            git commit -q -m "alert: held undelivered noise report $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              echo "Held on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — re-deriving on current main."
            sleep $((attempt * 5))
          done
          echo "::error::The noise report could not be delivered AND could not be held."
          exit 1
