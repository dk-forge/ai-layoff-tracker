name: Send email digest

# The sending half of the email digest. DORMANT until the owner adds a
# transport credential: with none set the job resolves to the dry run
# transport, prints the exact messages it WOULD send, and exits 0. A missing
# key is a state, not a failure, and a red run for it would teach everyone to
# ignore red runs.
#
# ARMED 2026-08-16 on Brevo SMTP. The five DIGEST_SMTP_* / DIGEST_FROM secrets
# are set and DIGEST_TRANSPORT below reads `smtp`. Changing providers later is
# that same one variable: smtp covers Brevo, SES-SMTP and most others with no
# code change at all.
#
# ARMING IS A CODE CHANGE ON PURPOSE, not a secret appearing. If this read an
# env var, the act of adding a password would start sending to real people with
# nothing in the history saying so and nobody having decided it. The transport
# is written here, in a reviewed commit, so turning it on is deliberate and
# turning it off is one word.
#
# The transport still refuses to send without its credentials: an smtp
# transport with no host or password falls back to the dry run, names the
# missing secret and exits 0. A missing key stays a state, not a failure.
#
# A REJECTED credential IS a failure, and that distinction is the whole of the
# 2026-08-19 change. Every run now opens one connection to the relay, logs in
# and hangs up before it reads a single recipient, so a run with nobody due
# still reports whether this job could send at all. Before that, the credential
# path was only walked when there was a message in hand: Brevo had been
# answering 535 since 2026-08-17 and every scheduled run was green, because
# every scheduled run had an empty list. The mailer's health row now carries
# `credential=<STATE>` beside the send counts, and ops_status reads it.
#
# THREE SLOTS, SIX CRON LINES, AND EXACTLY ONE SEND PER SLOT PER DAY.
#
#   daily    6:00 AM Eastern, seven days a week
#   weekly   7:30 AM Eastern, Mondays
#   monthly  9:00 AM Eastern, the 1st of the month (armed 2026-09-06)
#
# The owner asked for those two wall-clock times (2026-08-19). The week runs
# Monday to Sunday, so Monday morning is the first moment the week it looks
# back over is complete; a Sunday send would review a week still in progress.
# 7:30 rather than 6:00 so a subscriber who takes both tiers does not get two
# emails in the same minute. Daily stays SEVEN DAYS A WEEK: a quiet day still
# earns its send, because the digest prints `AI-attributed cuts: 0` and that
# is a reading, not a silence.
#
# THE MONTHLY SLOT IS THE SIGNUP'S OWN PROMISE READ AS A WALL CLOCK. The
# confirm panel says "Monthly editions go out at the start of each month,
# covering the month so far" (subscribe.php alt_digest_cadence_sentence), and
# the tier composed correctly for twelve days while no schedule carried it, so
# the promise was true of the code and false of the inbox. 9:00 rather than
# 6:00 or 7:30 for the weekly's reason: a 1st that is also a Monday already
# carries two editions, and a subscriber on every tier must not get two in one
# minute. The public monthly opt-in (alt_digest_offer_monthly) armed in the
# same change, because a slot nobody can subscribe to and an offer no slot
# fulfils are the same defect from two sides.
#
# WHY SIX CRON LINES FOR THREE SLOTS: DAYLIGHT SAVING.
# GitHub cron is UTC and has no notion of DST. 6:00 Eastern is 10:00 UTC under
# EDT and 11:00 UTC under EST; 7:30 Eastern is 11:30 UTC and 12:30 UTC; 9:00
# Eastern is 13:00 UTC and 14:00 UTC. Both
# candidates are scheduled and railway/digest_slot.py decides which one is the
# real slot today, from `github.event.schedule` (below) rather than from the
# wall clock, so a run GitHub delays by an hour still knows which slot it is.
# The other tick exits 0 having read nothing, built nothing, sent nothing and
# stamped nothing. A single fixed cron would have become a 5:00 AM email on
# 2026-11-01 with nothing anywhere saying so.
#
# THIS ADDS A SECOND SCHEDULE, AND THE COMMENT THAT USED TO STAND HERE ARGUED
# AGAINST THAT. It read: "Do not add a second cron line for the weekly tier:
# two schedules is two things to watch." It was written after the 2026-08-17
# defect, when this job ran once a day and CHOSE a tier, choosing weekly on a
# Monday, so every daily subscriber received nothing on a Monday, silently.
#
# That defect was auto-SELECTION with no external record of the intent, not
# the existence of two schedules. A tick that carries its own identity has
# nothing left to choose. What splitting really costs is a second thing that
# can fail quietly - the weekly slot stopping while the daily one carries on -
# and that is paid for rather than waved away: every weekly pass writes its own
# `digest_weekly` health row, sized to a 7-day cadence plus 2 days of slack,
# and ops_status raises an issue when it goes stale. Do not delete that row and
# leave this schedule standing.
#
# The 6:00 Eastern daily now runs BEFORE the site's own WP-Cron slot (13:00
# UTC) rather than ten minutes after it, which is the same ordering it always
# wanted: this job claims the tier first and the built-in wp_mail sender stands
# down for the day. The claim ages out after ALT_DIGEST_CLAIM_HOURS, so if this
# workflow stops the fallback resumes by itself.

on:
  schedule:
    # 6:00 AM Eastern - the daily digest. One of these two is a no-op each day.
    - cron: '0 10 * * *'    # 06:00 EDT (Mar-Nov)
    - cron: '0 11 * * *'    # 06:00 EST (Nov-Mar)
    # 7:30 AM Eastern Monday - the weekly look-back. Same pairing.
    - cron: '30 11 * * 1'   # 07:30 EDT (Mar-Nov)
    - cron: '30 12 * * 1'   # 07:30 EST (Nov-Mar)
    # 9:00 AM Eastern on the 1st - the monthly edition, month to date. Same
    # pairing; the 1st in UTC at these hours is still the 1st in New York.
    - cron: '0 13 1 * *'    # 09:00 EDT (Mar-Nov)
    - cron: '0 14 1 * *'    # 09:00 EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to 1 to render the digest and send nothing'
        required: false
        default: '1'
      verify_only:
        description: 'Set to 1 to prove the relay credential and stop. Connects, authenticates, hangs up. Reads no recipient, builds no message, stamps nothing.'
        required: false
        default: ''
      freq:
        description: 'daily, weekly, monthly, or blank for auto (daily every day, plus weekly on Mondays and monthly on the 1st)'
        required: false
        default: ''
      limit:
        description: 'Stop after N recipients. Use for a first live send.'
        required: false
        default: ''
      preview:
        description: 'Set to 1 to render the live sections when nobody is due. Never sends.'
        required: false
        default: ''
      test_to:
        description: 'Send the LIVE digest to this ONE address and nowhere else. Stamps nobody, closes no send row, refuses if real recipients are due.'
        required: false
        default: ''
      test_lists:
        description: 'Which sections that test message carries: layoff, talent, articles. Blank means all of them.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Send the digest
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # The one line that chooses a provider. dryrun sends nothing.
          DIGEST_TRANSPORT: smtp
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_SMTP_HOST: ${{ secrets.DIGEST_SMTP_HOST }}
          DIGEST_SMTP_PORT: ${{ secrets.DIGEST_SMTP_PORT }}
          DIGEST_SMTP_USER: ${{ secrets.DIGEST_SMTP_USER }}
          DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          # "Did my rotation work?", answerable without sending anybody an
          # email. The scheduled run performs this same check on every run;
          # this input is the manual form of it, and it stamps nothing.
          DIGEST_VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
          DIGEST_DRY_RUN: ${{ github.event.inputs.dry_run }}
          DIGEST_FREQ: ${{ github.event.inputs.freq }}
          # WHICH SLOT THIS RUN IS, from GitHub rather than from the clock.
          # Empty on a workflow_dispatch, which is how a manual run keeps the
          # old day-of-week behaviour and is never skipped by the DST guard.
          DIGEST_CRON: ${{ github.event.schedule }}
          DIGEST_LIMIT: ${{ github.event.inputs.limit }}
          # Reads the rendered email when the list has nobody due. It is
          # ignored by any transport that sends, so it cannot mail a
          # placeholder.
          DIGEST_PREVIEW: ${{ github.event.inputs.preview }}
          # A nominated single address, for "show me the email". It cannot
          # reach the list: the tier guard, the subscriber table and the
          # last-sent columns are all untouched by it, and it refuses to run
          # at all when real recipients are due. See digest_send._test_payload.
          DIGEST_TEST_TO: ${{ github.event.inputs.test_to }}
          DIGEST_TEST_LISTS: ${{ github.event.inputs.test_lists }}
        # THREE STATES, AND ONLY ONE OF THEM IS RED.
        #
        #   0  the pass ran. Sent, or nobody was due, or dormant.
        #   2  a fault. A refused credential, every delivery failing, or the
        #      recipient route answering wrongly. Red, and it should be: a
        #      human has something to do.
        #   3  UNKNOWN. The host could not be read at all - almost always its
        #      deploy maintenance window (HTTP 503) - after five bounded
        #      attempts. Nothing was claimed or stamped and the next run
        #      repeats the period.
        #
        # Exit 3 is NOT a red run, and that is deliberate. On 2026-08-19 (run
        # 32282266653) a send landed mid-deploy, read HTTP 503, exited 1 and
        # reddened - so a brief, self-clearing, unactionable host condition
        # manufactured a CI alert. That is the pattern CLAUDE.md names: an
        # outage manufacturing red runs which manufacture alerts.
        #
        # The skip is NOT silent for being green. digest_send.py records the
        # missed tier by name in the `digest_mailer` health row, where
        # ops_status [4c] and the weekly health digest read it, and the row's
        # 3-day staleness ceiling still catches a sender that has stopped. The
        # visibility lives in the health ledger, not in a red X.
        run: |
          set +e
          python digest_send.py
          code=$?
          set -e
          case "$code" in
            0) exit 0 ;;
            3) echo "::warning::the digest was NOT sent this run: the site could not be read (its deploy maintenance window, most likely). Nothing was claimed or stamped, the next run repeats the period, and the digest_mailer health row names the skipped tier. UNKNOWN is not a pass - if this repeats, read the health page." ; exit 0 ;;
            *) exit "$code" ;;
          esac
