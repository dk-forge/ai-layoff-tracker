name: ERM import (Eurofound, EU27+Norway)

# Europe's WARN-equivalent: per-company restructuring announcements curated by
# Eurofound's European Restructuring Monitor. Daily window import (14 days,
# idempotent by factsheet id) + on-demand full backfill since 2015.
# License: Eurofound authorizes reuse with attribution; every entry credits
# the ERM and links its factsheet.

on:
  schedule:
    - cron: '0 13 * * *'   # 9 AM ET: morning ingest window (after ERM's overnight updates)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (14-day window) or full (entire history since 2015)'
        required: false
        default: 'daily'

permissions:
  contents: write   # commit the deferral ledger, and only when it changed

jobs:
  erm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements-min.lock
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Mark pipeline refreshing
        run: |
          curl -sS -X POST "https://asktherecruiter.com/blog/wp-json/layoffs/v1/status" \
            -H "X-Layoff-API-Key: ${{ secrets.WP_API_KEY }}" -H "Content-Type: application/json" \
            -H "User-Agent: AiLayoffTracker/1.0 (+https://asktherecruiter.com)" \
            -d '{"phase":"refreshing"}' || true
      - name: Import ERM events
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          ERM_MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: |
          cd railway
          python erm_import.py

      # A deferral nobody counts is a silently green job, which is the exact
      # failure family this repo keeps digging out of. Free on a healthy run: a
      # job with no open deferral touches no file, so there is no diff, no
      # commit and no push.
      - name: Record the deferral ledger
        if: ${{ always() }}
        uses: ./.github/actions/commit-deferral-ledger
        with:
          job: erm-import
