name: Distress watchlist feeder (bankruptcy + insolvency)

# CourtListener US bankruptcy + Companies House UK insolvency -> distressed
# company names -> the same targeted-news + extractor + dedup + poster as the
# watchlist sweep. Filings signal distress but carry no job count, so only a
# real sourced layoff is ever posted. Ships DORMANT per source.
#
# Secrets: COURTLISTENER_API_KEY and/or COMPANIES_HOUSE_API_KEY_UK,
#          NEWSAPI_KEY, OPENROUTER_API_KEY, WP_API_KEY

on:
  schedule:
    - cron: '40 15 * * 2'   # weekly, Tue 11:40 AM ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to 1 to log candidates without posting'
        required: false
        default: ''

jobs:
  distress:
    runs-on: ubuntu-latest
    # Sized from measurement, 2026-08-05: median 19.0 min, max 26.1 over
    # the last 15 runs. 26.1 was 75% of the old 35 ceiling. 3x the median
    # rounded: 60.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run distress feeder
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
          COMPANIES_HOUSE_API_KEY_UK: ${{ secrets.COMPANIES_HOUSE_API_KEY_UK }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          DISTRESS_DRY: ${{ github.event.inputs.dry_run }}
        run: python distress_watchlist.py
