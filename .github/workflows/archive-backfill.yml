name: Source-archive backfill

# Give every tracker row a permanent Internet Archive (Wayback) copy of its
# source. The server hands out the next batch of DISTINCT un-archived source
# URLs (any row type: WARN / news / SEC / ERM), this job checks the free Wayback
# availability API first and only spends a rate-limited Save Page Now capture on
# URLs with no existing snapshot, then records the permalink per URL. It is
# resumable (a URL drops out once archived or recorded unavailable) and picks up
# brand-new rows automatically, so running daily guarantees forward coverage
# with NO change to the ingest write path. No LLM, no secrets beyond WP_API_KEY.
#
# Complements archive-sources.yml (which snapshots the ~50 WARN source FILES);
# this one covers and STORES every per-row source URL so the tracker can render
# an "Archived copy (Wayback Machine)" link beside each official source.
on:
  schedule:
    # DAILY. The 2026-07-23 hourly sprint has CLOSED — measured 2026-07-30, three
    # consecutive runs handed out 0, 2 and 7 candidate URLs against a per-run
    # limit of 1,500, and coverage sat flat at 21,110/25,029 distinct source URLs
    # (84.3%). What is left is not a backlog, it is the ~9 brand-new rows a day
    # the daily run picks up anyway; the difference hourly buys is that a new
    # row's Wayback copy lands within an hour instead of within a day, which is
    # not worth ~20 min/day of Actions minutes on a 9-second no-op.
    # NOTE (corrected 2026-08-02): the old claim here that pending URLs "never
    # re-enter the candidate list" was an artifact of measuring three HOURLY
    # sprint runs — at hourly cadence almost nothing had aged past the 72h
    # retry window, hence 0/2/7 candidates. At daily cadence the server hands
    # out full batches (500 on 2026-08-02). Two real defects WERE found and
    # fixed instead: (1) candidates were ordered newest-layoff-date-first, so
    # when more than one batch was due, the freshly restamped top slice cycled
    # every 72h and everything below it starved forever — ordering is now
    # never-checked first, then oldest-attempt first; (2) one 500-URL batch per
    # run cannot re-check a ~4,000-URL pending pool inside the promised week,
    # so archive_backfill.py now pages through batches up to
    # ARCHIVE_BACKFILL_LIMIT per run. The pages print "next check by <date>"
    # beside every un-archived source, and data_integrity's
    # archive_recheck_cadence invariant FAILS when the oldest un-archived
    # attempt exceeds 10 days (7d promise + 1d run granularity + 2d slack).
    # This cron time (05:25 UTC) is pinned to db.php ALT_ARCHIVE_DAILY_RUN_UTC
    # by railway/tests/test_archive_promise.py — change them together.
    - cron: '25 5 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Candidate URLs to process this run (server hands out 500 per batch; default 2000)'
        required: false
        default: '2000'
      spn_max:
        description: 'Max Save-Page-Now captures this run (respects Wayback limits; default 60)'
        required: false
        default: '60'
      dry_run:
        description: 'Set 1 to check + print without saving or writing'
        required: false
        default: ''

# The candidate query is idempotent, but two overlapping runs would double the
# Save-Page-Now load against Wayback's anonymous rate limit.
concurrency:
  group: archive-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Sized from measurement, 2026-08-05: runtime is bimodal - median 2.7
    # min but a legitimate 41.1-min run sat at 91% of the old 45 ceiling.
    # ~3x the slow mode: 120.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Capture permanent Wayback snapshots of source URLs
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # SIZED FROM THE CYCLE, 2026-08-06. The re-check promise is kept only
          # if the whole due pool is re-attempted inside a week, so the limit is
          # pool / promise, not a round number. Measured live that day: 3,782
          # distinct cited URLs still awaiting a snapshot. At 2,000 a run that is
          # ~1.9 days per full cycle, ~2.9 days worst age against the 10-day
          # bound. The previous 1,500 was never actually reached (see below).
          ARCHIVE_BACKFILL_LIMIT: ${{ github.event.inputs.limit || '2000' }}
          # NOT raised. Save Page Now is rate-limited for anonymous callers and
          # 16 of 80 captures were already being throttled on 2026-08-06.
          # Throughput here comes from the free availability pass, which is what
          # stamps checked_at and moves the cadence; cranking SPN buys nothing
          # and risks the budget.
          ARCHIVE_SPN_MAX: ${{ github.event.inputs.spn_max || '80' }}
          ARCHIVE_FLUSH_EVERY: '25'
          ARCHIVE_BACKFILL_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
          # 2400 -> 5400. THE DEADLINE WAS THE BINDING CONSTRAINT, not the limit.
          # Measured from the run logs: 2026-08-04 stopped on the deadline after
          # 1,231 of its 1,500 URLs; 08-05 and 08-06 each completed exactly ONE
          # 500-URL server batch and stopped. So the job had been advertising a
          # 1,500-URL capacity while delivering a median of 500, the pool needed
          # ~404/day just to stand still, and the promised weekly re-check went
          # false. Raising the batch size alone would have been a no-op.
          # 5400s at the measured 0.513 URL/s floor covers 2,770 URLs, comfortably
          # past the 2,000 limit, and still leaves half the 120-minute job
          # timeout spare. railway/tests/test_archive_promise.py asserts this
          # deadline can actually reach this limit, so the pair cannot drift back
          # into a capacity the run never delivers.
          ARCHIVE_BACKFILL_DEADLINE_SECONDS: '5400'
        # Data-changing job fails loudly: an unreachable candidate feed or a
        # failed /archive-record batch exits non-zero above.
        run: |
          set -o pipefail
          cd railway
          python archive_backfill.py | tee -a "$GITHUB_STEP_SUMMARY"
