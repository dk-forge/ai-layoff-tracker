name: AI evidence sweep

# Hunts an EXACT employer AI quote for the biggest 2026 layoffs we have NOT
# tagged as AI. Closes the gap where a cut was stored from a non-AI-framed
# source even though the employer named AI elsewhere (the BAT case). Never
# loosens the standard: no verbatim quote -> the row correctly stays untagged,
# so genuinely non-AI cuts (Canada Post, UPS) are never mislabelled.
#
# SAFE: dry-run until the AI_SWEEP_LIVE repo variable is 1 - it reports what it
# WOULD upgrade and writes nothing. Runs once daily (this is evidence
# completeness, not freshness; hourly would burn budget re-reading the same rows).
on:
  schedule:
    - cron: '15 16 * * *'   # 12:15 PM ET, after the day's collectors + reclassify
  workflow_dispatch:
    inputs:
      live:
        description: "Set 1 to arm upgrades for this run (else dry run)"
        required: false
        default: ''
jobs:
  sweep:
    runs-on: ubuntu-latest
    # DERIVED from the script's own deadline. The old 20 sat 23% above the
    # measured max (15.4 min job time on 2026-08-07) with the script owning no
    # clock at all, so a busier news day would have been cancelled mid-sweep.
    #   AI_SWEEP_DEADLINE_SECONDS                                    1140s
    # + worst single in-flight operation past the last deadline check:
    #   one source fetch = 3 attempts x 40s timeout + 5s + 10s backoff  135s
    # + measured job overhead (27s setup incl. the full-lock pip install,
    #   4s teardown, run 31412433065)                                   31s
    # = 1306s = 21.8 min -> 22 min, + 2 min runner variance
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run AI evidence sweep
        working-directory: railway
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          AI_SWEEP_LIVE: ${{ github.event.inputs.live || vars.AI_SWEEP_LIVE }}
          # Whole-run wall clock: 1.25 x the measured max script time (888s)
          # over the 7 runs since the Google News route went live, rounded up
          # to the whole minute. The script stops itself here so the runner
          # never has to; timeout-minutes above is derived from it.
          AI_SWEEP_DEADLINE_SECONDS: '1140'
        run: python ai_evidence_sweep.py
