name: Seed curated AI layoffs

# Manually triggered. Posts the curated, verified AI-attributed layoffs in
# railway/seed_data/ai_layoffs.json. Idempotent (dedup guard).
# Required secrets: WP_API_KEY

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses.
          #
          # Only the FULL lock is cached. The min-lock jobs deliberately have
          # no cache: measured 2026-08-19, a 130 MB restore made their 4-second
          # install about 5 seconds SLOWER, and setup-python's prefix
          # restore-key meant they pulled this heavy cache anyway. RUNBOOK,
          # "Runner minutes". Do not add it back.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Verify secret
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: '[ -n "$WP_API_KEY" ] || { echo "::error::WP_API_KEY not set."; exit 1; }'
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Seed
        working-directory: railway
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
        run: python seed_ai.py
