name: Broken-link check

# Daily check that every public tracker page returns 200, plus a sampled
# source-link reachability report. Alerts (and fails red) only when a PUBLIC
# PAGE is down; source-link rot is expected decay, reported not alerted, and is
# backstopped by the Wayback archiving. Read-only, no LLM, ~0 cost.

on:
  schedule:
    - cron: '30 14 * * *'   # daily, 10:30 AM ET
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many recent source links to sample'
        required: false
        default: '60'

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements-min.lock
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Check links
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          LINK_CHECK_SAMPLE: ${{ github.event.inputs.sample || '60' }}
        run: python link_check.py
