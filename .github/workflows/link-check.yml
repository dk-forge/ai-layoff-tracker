name: Broken-link check

# Daily check that every public tracker page returns 200, plus a sampled
# source-link reachability report. Alerts (and fails red) only when a PUBLIC
# PAGE is down; source-link rot is expected decay, reported not alerted, and is
# backstopped by the Wayback archiving. Read-only, no LLM, ~0 cost.

on:
  schedule:
    - cron: '30 14 * * *'   # daily, 10:30 AM ET
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many recent source links to sample'
        required: false
        default: '60'

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Check links
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # The operational mailer. Since 2026-08-20 this job's alerts go out
          # through Resend with the ops From line, not through the site's
          # /alert route, which wp_mail hands to the reader newsletter's
          # identity. Without this secret the job runs and says nothing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Passed wherever RESEND_API_KEY is, so one From line cannot become
          # two. The variable is unset today and opsmail's default applies; a
          # job that omitted this would keep the default on the day somebody
          # sets it, while the five older ops jobs moved. Two From lines is
          # precisely the defect this change exists to close.
          OPS_MAIL_FROM: ${{ vars.OPS_MAIL_FROM }}
          LINK_CHECK_SAMPLE: ${{ github.event.inputs.sample || '60' }}
        run: python link_check.py
