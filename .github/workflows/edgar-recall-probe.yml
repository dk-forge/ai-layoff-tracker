name: EDGAR recall probe (dry run)

# Diagnostic for the SEC Item 2.05 recall gap. Takes the committed gold set and
# asks, per filing, WHICH STAGE drops it: the full-text search pagination cap,
# the document fetch, the extractor's 2000-char truncation, or the LLM. Prints a
# stage tally and uploads the per-filing decisions.
#
# DRY RUN: no WP_API_KEY is passed, so nothing can be posted, edited or reported
# to source health. Manual dispatch only — this spends LLM calls and answers a
# question, it is not a data job.
#
# Required secret: OPENROUTER_API_KEY

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which gold-set events to probe'
        required: false
        default: 'misses'
        type: choice
        options: [misses, matched, all]
      limit:
        description: 'Cap the number of filings probed (blank = no cap)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses.
          #
          # Only the FULL lock is cached. The min-lock jobs deliberately have
          # no cache: measured 2026-08-19, a 130 MB restore made their 4-second
          # install about 5 seconds SLOWER, and setup-python's prefix
          # restore-key meant they pulled this heavy cache anyway. RUNBOOK,
          # "Runner minutes". Do not add it back.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Probe (prints the stage tally, posts nothing)
        working-directory: railway
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDGAR_USER_AGENT: 'AiLayoffTracker contact@asktherecruiter.com'
          PROBE_ONLY: ${{ github.event.inputs.only }}
          PROBE_LIMIT: ${{ github.event.inputs.limit }}
          PROBE_OUT: ${{ runner.temp }}/edgar-recall-probe.json
        run: python edgar_recall_probe.py
      - name: Upload per-filing decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgar-recall-probe
          path: ${{ runner.temp }}/edgar-recall-probe.json
          if-no-files-found: warn
