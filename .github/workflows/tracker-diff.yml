name: Tracker-diff discovery tripwire

# TWO HALVES OF ONE MACHINE, AND ONLY ONE OF THEM IS DORMANT.
#
# The CHASE (step "Run tracker-diff") needs a reference company list, which
# only ever arrived in a secret the owner decided against on 2026-07-28. It
# stays dormant, exits clean and costs nothing. Nothing below re-opens that
# question and nothing here should ever ask for those secrets again.
#
# The LEARNING half (step "Run tracker-learn") is ARMED and needs no secret at
# all. Its reference universe is the GDELT layoff corpus BEFORE our own
# trusted-domain gate: coverage our net could see and does not read. It stores
# no row, calls no model and names no competitor. What it produces is RULES —
# a wording to add, an outlet to review, a country or language we do not cover
# — mailed to the owner as paste-ready lines, plus the independent-recall
# figure that is supposed to trend up as those rules are adopted.
#
# COST: $0.00 in model spend per run, and no model may ever be added: the step
# is run with ALT_PAID_READS=off and without OPENROUTER_API_KEY, so a future
# paid call fails rather than quietly spends. The corpus read is the
# collector's own BigQuery mirror query (GDELT_PREFER_BQ=1 below, the same
# two env lines the collector workflows pass): one query of the collector's
# shape over the same 36h window, so it scans the same daily partitions the
# collector's broad slot already scans, under the same 30 GB per-query cap,
# inside the sandbox's free 1 TB/month. Then up to TRACKER_LEARN_MAX_CANDIDATES
# reads of our OWN public /query. Without the credentials it falls back to one
# keyless GDELT DOC query (bounded to two attempts) -- which is the read that
# went UNKNOWN on 2026-09-02/03/04, because that endpoint now answers 429 in
# seconds to every caller, GitHub's runners and a home Mac alike.
#
# Diffs competitor tracker feeds against our data; anything they list that we
# lack becomes a company-targeted primary-source query -> extractor -> add. We
# never cite them — their list is only a discovery signal pointing at a primary
# source. Each missing company is verified against SEC EDGAR (targeted per-
# company full-text, with a cross-reference guard so a filing that merely
# MENTIONS the company is rejected) AND press (NewsAPI + GDELT). WARN needs no
# per-company call: it is bulk-imported daily, so a missing company is by
# definition not in a WARN notice we already hold.
#
# BENCHMARK_FEED_URLS accepts JSON, CSV, OR a SITEMAP url. A tag/company
# sitemap is the cleanest feed: ONE url that auto-expands to the whole
# (self-refreshing) company list, so the secret holds a single link, not a
# static list that goes stale. Ships DORMANT: unset it and the job exits clean,
# so the repo holds zero competitor URLs (per the standalone-brand rule). The
# URL lives ONLY in the secret; hardcoding it here would name a competitor in
# the repo.
#
# Secrets: BENCHMARK_FEED_URLS or BENCHMARK_COMPANIES (either activates it),
# NEWSAPI_KEY, OPENROUTER_API_KEY, WP_API_KEY

on:
  schedule:
    - cron: '50 15 * * *'   # 11:50 AM ET, after the watchlist sweep
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to 1 to log candidates without posting'
        required: false
        default: ''

# The learning half commits its measurement file (see the step for why the
# trend cannot live on the runner).
permissions:
  contents: write

concurrency:
  group: tracker-diff
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses.
          #
          # Only the FULL lock is cached. The min-lock jobs deliberately have
          # no cache: measured 2026-08-19, a 130 MB restore made their 4-second
          # install about 5 seconds SLOWER, and setup-python's prefix
          # restore-key meant they pulled this heavy cache anyway. RUNBOOK,
          # "Runner minutes". Do not add it back.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run tracker-diff
        working-directory: railway
        env:
          BENCHMARK_FEED_URLS: ${{ secrets.BENCHMARK_FEED_URLS }}
          # Inline fallback list — tracker_diff.py reads this when no feed URL
          # is set (or in addition to it). Without this pass-through the secret
          # existed but never reached the script.
          BENCHMARK_COMPANIES: ${{ secrets.BENCHMARK_COMPANIES }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # The operational mailer. Since 2026-08-20 this job's alerts go out
          # through Resend with the ops From line, not through the site's
          # /alert route, which wp_mail hands to the reader newsletter's
          # identity. Without this secret the job runs and says nothing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Passed wherever RESEND_API_KEY is, so one From line cannot become
          # two. The variable is unset today and opsmail's default applies; a
          # job that omitted this would keep the default on the day somebody
          # sets it, while the five older ops jobs moved. Two From lines is
          # precisely the defect this change exists to close.
          OPS_MAIL_FROM: ${{ vars.OPS_MAIL_FROM }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          # Needed for the SEC full-text verification path (SEC rejects
          # anonymous requests). Reuses the same UA as the daily EDGAR import.
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          TRACKER_DIFF_DRY: ${{ github.event.inputs.dry_run }}
        run: python tracker_diff.py
      # The armed half. It runs AFTER the chase deliberately: both report under
      # the one `tracker_diff` health id (they are one collector), so the last
      # writer is the one the health page shows, and that should be the half
      # that actually did something.
      - name: Run tracker-learn
        working-directory: railway
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # The operational mailer. Since 2026-08-20 this job's alerts go out
          # through Resend with the ops From line, not through the site's
          # /alert route, which wp_mail hands to the reader newsletter's
          # identity. Without this secret the job runs and says nothing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Passed wherever RESEND_API_KEY is, so one From line cannot become
          # two. The variable is unset today and opsmail's default applies; a
          # job that omitted this would keep the default on the day somebody
          # sets it, while the five older ops jobs moved. Two From lines is
          # precisely the defect this change exists to close.
          OPS_MAIL_FROM: ${{ vars.OPS_MAIL_FROM }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          # Structural, not a promise: no OpenRouter key is in scope here and
          # paid reads are off, so a model call added to this path in future
          # fails loudly instead of quietly spending.
          ALT_PAID_READS: 'off'
          # The reference universe is the collector's own pre-gate corpus, and
          # since 2026-09-02 the public DOC API answers 429 to anyone, so it is
          # read where the collector reads it: the BigQuery mirror. Exactly the
          # two lines gdelt-backfill.yml and historical-news-sweep.yml pass.
          # Absent the secret the loop falls back to the DOC read and reports
          # UNKNOWN honestly, as it did for those three days.
          GCP_BIGQUERY_CREDENTIALS_JSON: ${{ secrets.GCP_BIGQUERY_CREDENTIALS_JSON }}
          GDELT_PREFER_BQ: '1'
        run: python tracker_diff.py --learn
      - name: Commit the learning trend
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Counts, dates and label words only — `assert_nameless` refuses to
          # write anything else, so this file cannot carry a name even if the
          # corpus is full of them. It is committed because the trend is the
          # whole point: independent recall is a number that only means
          # something across runs, and a runner's disk does not outlive the job.
          git add railway/tracker_learning_state.json
          git diff --cached --quiet && { echo "nothing learned to record"; exit 0; }
          git commit -m "learn: tracker independent-recall point $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push rejected, retrying ($i)"; sleep 10
          done
          exit 1
