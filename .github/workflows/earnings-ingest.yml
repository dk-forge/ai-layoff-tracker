name: Earnings-call transcript ingest

# Pulls recent earnings-call transcripts for watchlist tickers, keyword-sieves
# for layoff/restructuring/AI language, and sends only relevant chunks to the
# extractor — the highest-yield missing source class (cuts admitted on the call,
# not in a discrete 8-K). Ships DORMANT: with EARNINGS_API_KEY unset it exits
# clean. Add the secret (a transcript API key, e.g. Financial Modeling Prep) to
# activate.
#
# Secrets: EARNINGS_API_KEY (activates it), OPENROUTER_API_KEY, WP_API_KEY

on:
  schedule:
    - cron: '20 21 * * *'   # 5:20 PM ET — after most earnings calls
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to 1 to log candidates without posting'
        required: false
        default: ''

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: railway
        run: pip install -r requirements.txt
      - name: Run earnings ingest
        working-directory: railway
        env:
          EARNINGS_API_KEY: ${{ secrets.EARNINGS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          EARNINGS_DRY: ${{ github.event.inputs.dry_run }}
        run: python earnings_ingest.py
