name: Cleanup orphan plugin folder (diagnostic)

# One-off: removes the stray ai-layoff-tracker folder we accidentally created
# in the parked public_html space during the first mis-targeted deploy.
# Manual trigger only. Scoped to exactly one known path. Delete this file after.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Remove orphan folder
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ORPHAN: /public_html/wp-content/plugins/ai-layoff-tracker
        run: |
          set -euo pipefail
          echo "Removing $ORPHAN (and the empty wp-content tree it created, if empty)"
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:timeout 25;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            rm -r \"$ORPHAN\" || echo 'orphan folder already gone';
            rmdir /public_html/wp-content/plugins || echo 'plugins dir not empty or gone';
            rmdir /public_html/wp-content || echo 'wp-content not empty or gone';
          "
          echo "=== remaining contents of /public_html ==="
          lftp -c "
            set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            cls -1 /public_html/ || echo '(empty)';
          "
