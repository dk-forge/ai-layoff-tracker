name: Reclassify legacy AI evidence

# Small, repeatable batches keep costs bounded and revisit records whose source
# pages were temporarily unavailable. It never deletes rows or forces totals.
on:
  schedule:
    - cron: '22 3 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Rows to reassess (1-100; scheduled default is 5)'
        required: false
        default: '5'

permissions:
  contents: write   # commit the deferral ledger, and only when it changed

jobs:
  reclassify:
    runs-on: ubuntu-latest
    # Rows take ~2.5 min each (source refetch + evidence re-read); 20 min
    # cancelled every batch above ~6. 45 min fits the 1-100 input range's
    # practical batches while still bounding a hung run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      # Earned cadence (railway/spend.py). A QUEUE-DRAINING job that has spent
      # and produced nothing for several consecutive runs has an empty queue,
      # so it drops to one run in three until it produces again. It cannot miss
      # anything: the queue is still there next run and the job resumes where
      # it stopped. Discovery collectors are deliberately NOT eligible - running
      # one less often is a coverage decision, and spend.earned_skip refuses to
      # make it. Always exits 0; a job must not go red for being thrifty.
      - name: Earned cadence
        id: cadence
        run: python railway/spend.py --cadence
      - name: Spend guard (degrade, never halt)
        if: steps.cadence.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
        if: steps.cadence.outputs.skip != 'true'
      - name: Reassess linked source evidence
        if: steps.cadence.outputs.skip != 'true'
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RECLASSIFY_BATCH: ${{ github.event.inputs.batch || '5' }}
          # A source fetch plus one model retry can be slow. Leave a clear
          # margin below the 20-minute Actions hard limit and resume next day.
          RECLASSIFY_DEADLINE_SECONDS: '900'
          OPENROUTER_TIMEOUT_SECONDS: '35'
        run: |
          cd railway
          for attempt in 1 2 3; do
            python reclassify_legacy_ai.py && exit 0
            echo "::warning::attempt $attempt failed; auto-retrying in $((attempt*45))s"
            sleep $((attempt*45))
          done
          echo "::error::still failing after 3 attempts"
          exit 1

      # A deferral nobody counts is a silently green job, which is the exact
      # failure family this repo keeps digging out of. Free on a healthy run: a
      # job with no open deferral touches no file, so there is no diff, no
      # commit and no push.
      - name: Record the deferral ledger
        if: ${{ always() }}
        uses: ./.github/actions/commit-deferral-ledger
        with:
          job: reclassify-legacy-ai
