name: Cross-source dedup (daily deep scan)

# Removes duplicate entries that exact-hash and 30-day fuzzy dedup miss:
# the same layoff reported across sources (news + ERM + WARN), under name
# variants, or more than 30 days apart. DeepSeek decides same-event vs
# distinct-event; the winner is kept, the rest trashed (hashes suppressed,
# removal logged in the public corrections log). Runs in the daily cleanup
# window, after the morning ingest.

on:
  schedule:
    - cron: '30 14 * * *'   # 10:30 AM ET: after 9 AM ingest, before the 11 AM settle
  workflow_dispatch:
    inputs:
      max_clusters:
        description: 'Max clusters to review (caps LLM cost)'
        required: false
        default: '60'

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements-min.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Mark pipeline cleaning
        run: |
          curl -sS -X POST "https://asktherecruiter.com/blog/wp-json/layoffs/v1/status" \
            -H "X-Layoff-API-Key: ${{ secrets.WP_API_KEY }}" -H "Content-Type: application/json" \
            -H "User-Agent: AiLayoffTracker/1.0 (+https://asktherecruiter.com)" \
            -d '{"phase":"cleaning"}' || true
      - name: Deduplicate across sources
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEDUPE_MAX_CLUSTERS: ${{ github.event.inputs.max_clusters || '60' }}
        run: |
          cd railway
          python dedupe_llm.py
