name: Data quality report (anomaly flags)

# Surfaces entries worth a human look BEFORE a journalist finds them:
#   - single WARN notices with unusually large headcounts (>= 5,000)
#   - the same company filing in several states within 60 days (possible
#     overlapping multi-state counts, like remote-workforce filings)
#   - huge notices that only link to a state list page (no exact document)
# Runs DAILY (two hours after the 9 AM ET WARN import) and on demand; read the
# output in the Actions log.

on:
  schedule:
    - cron: '0 15 * * *'   # 11 AM ET: after the 9 AM ingest, corrections run and the
                           # daily number settles a full hour before people check at noon
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    # Sized from measurement, 2026-08-05: healthy runs of this whole job take
    # 0.6-0.9 min (snapshot ~26s, report ~4s, spot-check ~10-30s). The three
    # runs cancelled AT this ceiling (Jul 29, Aug 3, Aug 5 - run 31021670125)
    # were not the corpus outgrowing 10 minutes; they were the spot-check's
    # LLM call hanging past its per-socket timeout. The script now owns a
    # 360s wall-clock deadline (DEADLINE_SECONDS in
    # railway/daily_classification_spotcheck.py) and finishes cleanly, so the
    # worst case is ~40s of earlier steps + 360s + teardown, about 7 minutes.
    # 10 keeps >30% headroom over that worst case and stays the last-resort
    # backstop, never the thing that ends a run.
    timeout-minutes: 10
    steps:
      # The classification spot-check is now a versioned repository script
      # rather than an inline heredoc, so it must be checked out first.
      - uses: actions/checkout@v5
      - name: Mark pipeline cleaning
        run: |
          curl -sS -X POST "https://asktherecruiter.com/blog/wp-json/layoffs/v1/status" \
            -H "X-Layoff-API-Key: ${{ secrets.WP_API_KEY }}" -H "Content-Type: application/json" \
            -H "User-Agent: AiLayoffTracker/1.0 (+https://asktherecruiter.com)" \
            -d '{"phase":"cleaning"}' || true
      - name: Daily numbers snapshot (the reconciliation ping)
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, urllib.request, datetime
          API = "https://asktherecruiter.com/blog/wp-json/layoffs/v1/aggregate"
          def get(q=""):
              req = urllib.request.Request(API + q, headers={
                  "User-Agent": "AiLayoffTracker/1.0 (+https://asktherecruiter.com)"})
              return json.load(urllib.request.urlopen(req, timeout=60))["totals"]
          # THIS TABLE IS A RECONCILIATION SURFACE, so it is read on the basis
          # the page it reconciles against publishes. Every windowed call names
          # date_basis=notice: since 2.20.4 the tracker's default is the FILING
          # date, and a step whose own name is "the reconciliation ping" printing
          # the effective-basis total beside a link telling the reader to compare
          # it with the live page is the seven-places defect, daily, at the exact
          # moment somebody checks the number.
          #
          # Rows with no date filter (All time) are basis-independent: alt_db_where
          # applies alt_db_date_col only to from/to/years/quarters/months, so a
          # query carrying none of them adds no date predicate. Measured
          # 2026-08-11: worldwide all time is byte-identical on both bases
          # (20,383,596 jobs / 63,619 entries).
          #
          # The labels changed with the basis. `years=<y>` was printed as "YTD"
          # and is the whole calendar year, which under either basis holds
          # notices already filed for effective dates still ahead. The tracker
          # hero says "calendar year" for the same window and for the same
          # reason; this now matches it instead of contradicting it.
          NOTICE = "&date_basis=notice"
          y = datetime.date.today().year
          allt = get(); ytd = get(f"?years={y}{NOTICE}"); prev = get(f"?years={y-1}{NOTICE}")
          us = get(f"?years={y}&country=United%20States{NOTICE}")
          print(f"## Daily snapshot - {datetime.date.today()}")
          print(f"| Scope | Layoffs | Jobs | AI jobs | Announced |")
          print(f"|---|---|---|---|---|")
          print(f"| All time | {allt['entries']:,} | {allt['jobs']:,} | {allt['ai_jobs']:,} | {allt.get('announced_jobs',0):,} |")
          print(f"| {y} calendar year | {ytd['entries']:,} | {ytd['jobs']:,} | {ytd['ai_jobs']:,} | {ytd.get('announced_jobs',0):,} |")
          print(f"| {y} calendar year, US | {us['entries']:,} | {us['jobs']:,} | {us['ai_jobs']:,} | {us.get('announced_jobs',0):,} |")
          print(f"| {y-1} full | {prev['entries']:,} | {prev['jobs']:,} | {prev['ai_jobs']:,} | - |")
          print(f"\nRange: {allt['min_date']} to {allt['max_date']} · {allt['states']} US states · {allt['countries']} countries")
          print(f"\nDated rows are counted on the FILING date (date_basis=notice), the tracker page's own default since 2.20.4, so these figures reproduce what the page publishes. All-time rows carry no date filter and are the same on either basis.")
          print(f"\nHow we compare to announcement surveys, tech-event trackers and WARN aggregators is explained by CATEGORY (no competitor named) at https://asktherecruiter.com/blog/ai-layoff-tracker/#alt-metric-definitions - differences are definitional.")
          PY

      - name: Build report
        run: |
          python3 - <<'PY'
          import json, urllib.request, collections

          API = "https://asktherecruiter.com/blog/wp-json/layoffs/v1/"
          def get(path):
              req = urllib.request.Request(API + path, headers={
                  "User-Agent": "AiLayoffTracker/1.0 (+https://asktherecruiter.com)"})
              return json.load(urllib.request.urlopen(req, timeout=60))

          big = get("query?sources=warn&sort=job_count&dir=desc&per_page=100")["data"]
          flags = [r for r in big if r["job_count"] >= 5000]
          print(f"=== WARN notices >= 5,000 workers ({len(flags)}) — verify each against its filing ===")
          for r in flags:
              exact = "exact-link" if any(t in (r.get("source_url") or "")
                       for t in (".pdf", "record")) or (r.get("source_url") or "").rstrip("/").split("/")[-1].isdigit() else "LIST-PAGE-ONLY"
              print(f"  {r['layoff_date']}  {r['job_count']:>7,}  {r['state']:2}  {r['company_name'][:44]:45} [{exact}]")

          # same company filing in multiple states (overlap risk)
          seen = collections.defaultdict(set)
          for r in big:
              key = (r["company_name"].lower().strip(), (r["layoff_date"] or "")[:7])
              seen[key].add(r["state"])
          multi = {k: v for k, v in seen.items() if len(v) > 1}
          print(f"\n=== same company, same month, multiple states ({len(multi)}) — counts may overlap ===")
          for (name, month), states in sorted(multi.items()):
              print(f"  {month}  {name[:50]:51} states: {', '.join(sorted(states))}")

          # ERM records the same restructuring wave globally AND per country
          # ("Multiple countries" 1,000 + Netherlands 200 for one Booking.com
          # event) — flag same-company pairs so totals aren't double-cited.
          erm = get("query?sources=erm&sort=layoff_date&dir=desc&per_page=100")["data"]
          by_co = collections.defaultdict(list)
          for r in erm:
              by_co[r["company_name"].lower().strip()].append(r)
          pairs = []
          for name, rows in by_co.items():
              buckets = {r["country"] for r in rows}
              if len(rows) > 1 and "Multiple countries" in buckets and len(buckets) > 1:
                  pairs.append((name, [(r["country"], r["job_count"], r["layoff_date"]) for r in rows]))
          print(f"\n=== ERM global + per-country records for one company ({len(pairs)}) — counts may overlap ===")
          for name, rows in pairs:
              print(f"  {name[:44]:45} " + "; ".join(f"{c} {j:,} ({d})" for c, j, d in rows))

          if flags or multi:
              print("\nReview these before citing state-level totals.")
          else:
              print("\nNo anomalies flagged this week.")
          PY

      # Spend guard (railway/spend.py). Sets ALT_PAID_READS=off for the steps
      # below when the month is past its allowance. Never fails the job: the
      # free anomaly report above has already run and is the part that matters.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 railway/spend.py --degrade

      - name: Classification spot-check (LLM second opinion)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          # The operational mailer. Since 2026-08-20 this job's alerts go out
          # through Resend with the ops From line, not through the site's
          # /alert route, which wp_mail hands to the reader newsletter's
          # identity. Without this secret the job runs and says nothing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 railway/daily_classification_spotcheck.py
