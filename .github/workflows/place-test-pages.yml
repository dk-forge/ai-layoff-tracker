name: Place test pages (diagnostic)

# One-off: uploads uniquely-tagged HTML files through the CURRENT FTP creds so
# we can see (via public URLs) whether these creds actually control the live
# site. Manual trigger. Files are removed by cleanup once we've checked.

on:
  workflow_dispatch:

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Create + upload marker files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "ALT-TEST-ROOT-9F3A2C · uploaded via GitHub Actions FTP" > alt-test-root.html
          echo "ALT-TEST-BLOG-9F3A2C · uploaded via GitHub Actions FTP" > alt-test-blog.html

          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:timeout 25;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            put alt-test-root.html -o /public_html/alt-test-root.html;
            mkdir -f -p /public_html/blog;
            put alt-test-blog.html -o /public_html/blog/alt-test-blog.html;
            echo '--- /public_html/ now contains:';
            cls -1 /public_html/;
            echo '--- /public_html/blog/ now contains:';
            cls -1 /public_html/blog/;
          "
          echo "Done. Check the public URLs."
