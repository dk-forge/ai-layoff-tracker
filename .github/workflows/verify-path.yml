name: Verify WordPress path (diagnostic)

# One-off: with the CURRENT creds, tests the corrected path that includes the
# AskTheRecruiter.com folder, and whether this account can reach it at all.
# Manual trigger. Delete after.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Probe corrected paths
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          conn="set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:timeout 25; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";"

          echo "===== Can we list the cPanel home? (jail test) ====="
          lftp -c "$conn cls -1 /home1/xhcvdemy/" || echo "CANNOT reach /home1/xhcvdemy/ (account is jailed)"

          echo "===== /home1/xhcvdemy/public_html/ ====="
          lftp -c "$conn cls -1 /home1/xhcvdemy/public_html/" || echo "CANNOT list"

          echo "===== /home1/xhcvdemy/public_html/AskTheRecruiter.com/ ====="
          lftp -c "$conn cls -1 /home1/xhcvdemy/public_html/AskTheRecruiter.com/" || echo "CANNOT list"

          echo "===== /home1/xhcvdemy/public_html/AskTheRecruiter.com/blog/ (should show wp-config etc.) ====="
          lftp -c "$conn cls -1 /home1/xhcvdemy/public_html/AskTheRecruiter.com/blog/" || echo "CANNOT list"

          echo "===== Candidate wp-config.php paths (corrected, case-sensitive) ====="
          for p in \
            "/home1/xhcvdemy/public_html/AskTheRecruiter.com/blog/wp-config.php" \
            "/public_html/AskTheRecruiter.com/blog/wp-config.php" \
            "/home1/xhcvdemy/public_html/AskTheRecruiter.com/blog/wp-content/plugins" ; do
            if lftp -c "$conn cls -1 \"$p\"" >/dev/null 2>&1; then
              echo "FOUND:   $p"
            else
              echo "MISSING: $p"
            fi
          done
