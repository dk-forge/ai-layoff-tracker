name: Verify WordPress path (diagnostic)

# Single-connection, hang-proof probe: confirms login, shows where it lands,
# and tests whether it can reach the blog's wp-config.php. Manual trigger.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Probe (one session, 60s cap)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          timeout 60 lftp -c "
            set net:timeout 12;
            set net:max-retries 1;
            set net:reconnect-interval-base 4;
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            echo '--- pwd (where login lands):';
            pwd;
            echo '--- contents of login root:';
            cls -1 ./;
            echo '--- try: wp-config.php at login root:';
            cls -1 wp-config.php;
            echo '--- try: wp-content/plugins at login root:';
            cls -1 wp-content/plugins/;
            echo '--- try: /public_html/AskTheRecruiter.com/blog/wp-config.php:';
            cls -1 /public_html/AskTheRecruiter.com/blog/wp-config.php;
          " ; echo "=== lftp exit: $? (0=all commands ok; nonzero=some path missing or auth failed) ==="
