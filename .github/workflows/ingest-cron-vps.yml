name: Daily ingest on the VPS (railway/cron.py)

# The daily ingest that Railway runs today (`railway/railway.toml`,
# `python cron.py`, 22:00 UTC), as a GitHub job on the Contabo self-hosted
# runner. Added 2026-09-28 to let the owner retire the Railway service
# (cost trim). It is DORMANT until he opts in:
#
#   * the schedule fires only when the repo variable ALT_INGEST_ON_VPS is
#     'true'. Both running at once would pay for the same candidates twice
#     (seen-urls only protects rows that were already POSTed), so the order is:
#     disable the Railway cron FIRST, then set the variable. RUNBOOK
#     "Which jobs run on the VPS and why" carries the steps.
#   * workflow_dispatch always runs, for a one-off proof run.
#
# The schedule string is the SAME as railway.toml's cronSchedule on purpose:
# run_slice.py and generate_ingest_schedule.py derive the rotation and the
# public "next update" promise from railway.toml. If the time ever moves,
# move both, regenerate data/ingest-schedule.json, and keep it AFTER 21:00
# UTC and BEFORE the 13:10 UTC digest (railway.toml explains why). 22:00 UTC
# is already the VPS's quiet window: nothing but the hourly probes and the
# 23:40 subscriber watch is scheduled between 19:00 and 02:00 UTC.
#
# Class (a) in RUNBOOK terms: it POSTs to the host, so it runs on the one
# whitelisted address. It also fetches Google News, SEC EDGAR, GDELT (BigQuery)
# and the EDINET/OpenDART/CVM probes from that box; the first proof dispatch
# must be read for 403s/timeouts on those (the WARN precedent: a third of the
# state sites refuse the VPS) before the variable is set.
#
# Required secrets: OPENROUTER_API_KEY, WP_API_KEY. Optional:
# GCP_BIGQUERY_CREDENTIALS_JSON, EDINET_API_KEY_JP, OPENDART_API_KEY_KR,
# SENTRY_DSN. Any other variable set on the Railway service (ALT_GATE_MODE,
# GDELT_PREFER_BQ, GOOGLE_NEWS_MAX, ...) is invisible from the repo and must be
# copied here by the owner before the switch, or it silently reverts to the
# code default.

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: ingest-cron
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || vars.ALT_INGEST_ON_VPS == 'true'
    runs-on: [self-hosted, linux, contabo]
    # railway.toml overlapSeconds = 7200: the collector's one-hour GDELT
    # budget plus an hour for extraction, posting and the other sources.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Verify secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          missing=0
          for v in OPENROUTER_API_KEY WP_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set."; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run the daily ingest
        working-directory: railway
        env:
          ALT_JOB: railway-cron
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          GCP_BIGQUERY_CREDENTIALS_JSON: ${{ secrets.GCP_BIGQUERY_CREDENTIALS_JSON }}
          EDINET_API_KEY_JP: ${{ secrets.EDINET_API_KEY_JP }}
          OPENDART_API_KEY_KR: ${{ secrets.OPENDART_API_KEY_KR }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EDGAR_USER_AGENT: 'AiLayoffTracker contact@asktherecruiter.com'
          # Copied from the Railway layoff-cron service (owner paste 2026-09-28);
          # the other GDELT_* and OPENROUTER_MODEL values there equal the code defaults.
          GDELT_PREFER_BQ: '1'
        run: python cron.py
