name: Recall + precision measurement

# The "measure, don't guess" harness. RECALL: diff a held-out gold set of real
# layoffs against our data → recall % + which geo/sector cell the misses cluster
# in (the discovery roadmap). PRECISION: re-fetch published sources and confirm
# the stored count appears verbatim → false-positive rate (the guard roadmap).
# Read-only except a health-status post. Weekly.
#
# Required secret (only for the health post): WP_API_KEY

on:
  schedule:
    - cron: '10 16 * * 1'   # Mondays 12:10 PM ET
  workflow_dispatch:
    inputs:
      sample:
        description: 'Precision sample size (default 40)'
        required: false
        default: '40'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: railway
        run: pip install -r requirements.txt
      - name: Run recall + precision
        working-directory: railway
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          RP_PRECISION_SAMPLE: ${{ github.event.inputs.sample || '40' }}
        run: python recall_precision.py
