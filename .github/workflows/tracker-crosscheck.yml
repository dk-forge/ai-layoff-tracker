name: Coverage cross-check (manual)

# Works BACKWARDS from a provided reference checklist (company + date + approx
# count) to find events we're MISSING, and emits targeted news-search queries so
# the news -> DeepSeek pipeline can find a PRIMARY SOURCE for each gap. It never
# writes data (every number must trace to a receipt). Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      checklist_url:
        description: 'URL to a CSV/JSON checklist of {company,date,approx_count}'
        required: true
      window_days:
        description: 'Match window in days around each reference date'
        required: false
        default: '45'

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch checklist + report coverage gaps
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          CROSSCHECK_WINDOW_DAYS: ${{ github.event.inputs.window_days || '45' }}
        run: |
          cd railway
          set -o pipefail
          curl -fsSL "${{ github.event.inputs.checklist_url }}" -o /tmp/checklist_input
          CROSSCHECK_INPUT=/tmp/checklist_input python tracker_crosscheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-gaps
          path: railway/tracker_crosscheck_gaps.json
          if-no-files-found: ignore
