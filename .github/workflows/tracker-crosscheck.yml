name: Coverage cross-check (weekly QA)

# Works BACKWARDS from a reference checklist of notable layoffs to find events
# we're MISSING, and emits targeted news-search queries so the news -> DeepSeek
# pipeline can find a PRIMARY SOURCE for each gap. It never writes data (every
# number must trace to a receipt). Runs weekly against the committed checklist
# (railway/seed_data/crosscheck_checklist.csv); a manual dispatch can point it at
# any other checklist URL instead.
on:
  schedule:
    - cron: '0 9 * * 2'   # Tuesdays 09:00 UTC
  workflow_dispatch:
    inputs:
      checklist_url:
        description: 'Optional checklist URL (CSV/JSON of company,date,count). Blank = use the committed checklist.'
        required: false
        default: ''
      window_days:
        description: 'Match window in days around each reference date'
        required: false
        default: '60'

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements-min.lock
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Report coverage gaps (feed the sourcing pipeline)
        working-directory: railway
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          CROSSCHECK_WINDOW_DAYS: ${{ github.event.inputs.window_days || '60' }}
          CHECKLIST_URL: ${{ github.event.inputs.checklist_url || '' }}
        run: |
          set -o pipefail
          if [ -n "$CHECKLIST_URL" ]; then
            curl -fsSL "$CHECKLIST_URL" -o /tmp/checklist_input
            CROSSCHECK_INPUT=/tmp/checklist_input python tracker_crosscheck.py
          else
            CROSSCHECK_INPUT=seed_data/crosscheck_checklist.csv python tracker_crosscheck.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-gaps
          path: railway/tracker_crosscheck_gaps.json
          if-no-files-found: ignore
