name: Superset dedup reconciliation

# Marks a company-wide news/announced total or its site-level WARN rows as a
# subset of the same event's most-complete row (superset_of), so one real layoff
# is counted once instead of double-summed. DEFAULT DRY-RUN: reports
# jobs_before / jobs_excluded / jobs_after without writing. Pass apply=1 to write.
#
# WHY THIS NO LONGER SHELLS OUT TO `curl --fail-with-body` (2026-08-11).
# /reconcile-supersets is a route on Bluehost. When the host 5xx'd for six
# minutes on 2026-07-31 this job died red, the red run fired `ci_alert.py`, and
# the alerter then had to reach `/alert` — on the same host that was down. One
# outage manufacturing red runs which manufacture alerts which also fail.
# `railway/host_call.py` resolves the call to three outcomes instead of two: a
# host that never answered DEFERS (exit 0, counted in the committed ledger,
# shown in `ops_status [4d]`, red on the THIRD in a row), while a real refusal —
# wrong key, missing route, or a 2xx body reporting a failed batch — still exits
# non-zero on the first occurrence, exactly as `--fail-with-body` did.
#
# SAFE TO DEFER, and this is the reason: the marking is a CLEAN-SLATE RECOMPUTE
# (resets every mark to 0, then re-marks from the current rows). Running it
# tomorrow is identical to running it today; a skipped day leaves the previous
# day's marks in place, which is exactly what a red run left too — with an email
# nobody could send attached.

on:
  # Runs DAILY after the day's ingests so fresh news+WARN overlaps are deduped
  # automatically — the marking is a clean-slate recompute each time (resets to
  # 0, then re-marks), so it self-maintains as new rows land, change, or dedup.
  schedule:
    - cron: '40 16 * * *'   # 12:40 PM ET, after WARN (9 AM ET) + morning news
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to 1 to WRITE (mark rows). Empty = dry-run report only.'
        required: false
        default: ''
      detail:
        description: 'Set to 1 to also LIST the rows whose mark changes (max 500).'
        required: false
        default: ''
      probe:
        description: 'Employer name fragment: dump what the reconciler loads for it.'
        required: false
        default: ''

permissions:
  contents: write   # commit the deferral ledger, and only when it changed

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # No `pip install`: host_call.py, http_retry.py and deferral_ledger.py are
      # stdlib-only, so the path that has to work when the host is misbehaving
      # cannot be broken by dependency resolution.
      - name: Reconcile supersets
        id: call
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          # Scheduled runs ALWAYS apply (self-maintaining dedup); manual runs use
          # the input and default to a safe dry-run report.
          APPLY="${{ github.event.inputs.apply }}"
          DETAIL="${{ github.event.inputs.detail }}"
          PROBE="${{ github.event.inputs.probe }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then APPLY=1; fi
          python3 railway/host_call.py \
            --job reconcile-supersets \
            --url "https://asktherecruiter.com/blog/wp-json/layoffs/v1/reconcile-supersets?apply=$APPLY&detail=$DETAIL" \
            --form "probe=$PROBE" \
            --api-key-env WP_API_KEY \
            --envelope deferral_envelope.json \
            --output response.json

      # Gated on the host having ANSWERED. A deferred call writes no response
      # file on purpose, so an ungated parse would turn a quiet deferral back
      # into a red run for the wrong reason.
      - name: Report what changed
        if: ${{ steps.call.outputs.outcome == 'ok' }}
        run: |
          # A detail=1 body is one enormous JSON line, and the Actions log
          # uploader silently DROPS a line that big — the run goes green and
          # prints nothing. Print the summary, then a bounded per-company
          # rollup of the marks that changed, one line each.
          python3 - <<'PY'
          import json
          d = json.load(open('response.json'))
          changed = d.pop('changed', [])
          for p in d.pop('probed', []):
              print(f"  PROBE {p['id']}\t{p['company_key']!r}\t{p['company']!r}\t{p['layoff_date']}\t"
                    f"{p['state']}\t{p['source_type']}\t{p['job_count']}\twas={p['was']}\tnow={p['now']}")
          print(json.dumps(d))
          if not changed:
              raise SystemExit(0)
          if len(changed) < d['changes']:
              print(f"  NOTE: listing {len(changed)} of {d['changes']} changes (truncated)")
          by = {}
          for c in changed:
              b = by.setdefault(c['company_key'], {'rows': 0, 'newly_excluded': 0, 'un_excluded': 0, 'name': c['company']})
              b['rows'] += 1
              if c['now'] and not c['was']:
                  b['newly_excluded'] += c['job_count']
              elif c['was'] and not c['now']:
                  b['un_excluded'] += c['job_count']
          for key, b in sorted(by.items(), key=lambda kv: -(kv[1]['newly_excluded'] + kv[1]['un_excluded'])):
              print(f"  {key}\t rows={b['rows']}\t newly_excluded={b['newly_excluded']}\t un_excluded={b['un_excluded']}\t {b['name']}")
          print("--- rows ---")
          for c in changed:
              print(f"  {c['id']}\t{c['company_key']}\t{c['layoff_date']}\t{c['state']}\t{c['source_type']}\t{c['job_count']}\twas={c['was']}\tnow={c['now']}")
          PY

      # Costs nothing on a healthy run: a successful call against a job with no
      # open deferral touches no file, so there is no diff and no push.
      - name: Record the deferral ledger
        if: ${{ always() }}
        uses: ./.github/actions/commit-deferral-ledger
        with:
          job: reconcile-supersets
