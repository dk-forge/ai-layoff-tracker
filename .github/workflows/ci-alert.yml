name: CI failure alert

# A red run becomes an email. Until this existed, a failure reached GitHub
# Actions and stopped there: test_dedup_live.py caught Spirit Airlines reading
# 11,069 jobs instead of ~7,069 and reddened CI EIGHT times over several hours
# while the wrong number stayed live, because the only person who could act was
# not watching the tab.
#
# WHY A workflow_run LISTENER, and not the two obvious alternatives
# -----------------------------------------------------------------
# 1. A `if: failure()` step in each workflow — this repo has 66 workflow files.
#    Sixty-six edits, sixty-six chances to forget one, and the one you forget is
#    the one that breaks. Worse, a step inside the failing job runs on the SAME
#    runner as the failure: an OOM, a timeout kill or a cancelled job takes the
#    alerting step with it, so the alert is least reliable exactly when the
#    failure is most severe.
# 2. A reusable workflow / composite action — better, but still needs a `jobs:`
#    entry added to all 66, so it has the same coverage-by-diligence problem.
#
# This listener subscribes to EVERY workflow in the repo from one file, so a
# workflow added tomorrow is covered the moment it exists, with nothing to
# remember. It fires for `schedule` runs as well as push/PR/dispatch — the
# `workflow_run` event keys off a run COMPLETING, not off how it started, which
# matters here because most of this repo's data-writing jobs are cron-only.
# And because it runs in its own job on its own runner, it cannot be taken down
# by whatever took down the run it is reporting on, and it can never mask that
# original failure — the failing run is already red before this starts.
#
# Cost: nothing. This repo is public, so Actions minutes are free.

on:
  workflow_run:
    workflows: ['*']
    types: [completed]

permissions:
  contents: write        # commit an undeliverable alert into railway/alert_outbox.json
  actions: read          # needed to read the failed run's log
  checks: read           # check-run annotations: the ONLY place the runner
                         # records "exceeded the maximum execution time", which
                         # is how a self-timeout is told from a superseded push.
                         # Without this the self-timeout class silently returns
                         # to being invisible, which is the bug it closes.

jobs:
  alert:
    # `skipped` is not alertable, and `cancelled` is admitted here but ALMOST
    # ALWAYS discarded by ci_alert.py a few seconds later. Superseded pushes and
    # concurrency groups cancel runs routinely and mailing about those is
    # precisely the noise that gets a sender filtered, so the quiet is kept —
    # but it is now decided on EVIDENCE rather than on the conclusion string.
    #
    # A job killed by its own `timeout-minutes` also reports `cancelled`, and
    # the blanket filter made that class permanently silent: "Archive WARN
    # sources to Wayback" died at 20m2xs on every run it has ever had
    # (2026-07-27 and 2026-08-03, never once completing), and "Data quality
    # report" died at 10m27s twice against a normal runtime of 45 seconds. No
    # email fired for any of them, by design, while the archive re-check
    # invariant drifted to 8.6 days against its 10-day bound.
    #
    # ci_alert.py reads the job's check-run annotations and alerts only when it
    # finds "has exceeded the maximum execution time of ...", which nothing but
    # a self-timeout produces. Everything else returns 0 and says why. The cost
    # of admitting `cancelled` is one cheap run per cancellation (2 in the last
    # 300 runs), and Actions minutes are free on a public repo.
    #
    # The name check is a recursion guard. GitHub does not re-trigger
    # workflow_run for a run this token started, but a loop here would mail in
    # a loop, and that is not a failure mode worth discovering empirically.
    if: >-
      github.event.workflow_run.name != 'CI failure alert' &&
      contains(fromJSON('["failure","timed_out","startup_failure","cancelled","success"]'),
               github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `ref: main` explicitly. A workflow_run checkout can land detached, and
      # the hold step below has to be able to commit onto main.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # WHAT CHANGED ON 2026-07-31, AND WHY THIS STEP CAN NOW GO GREEN WITHOUT
      # THE OWNER HAVING BEEN TOLD ANYTHING YET.
      #
      # /alert is a route on the WordPress host. When Bluehost 504'd for seven
      # minutes, the sibling tracker's jobs failed and this same alerter — same
      # design, same host — failed four times reporting them, then exited 1, so
      # the outage manufactured extra red runs which manufactured more alerts
      # which also failed. The alerting system depended on the host it was
      # alerting about.
      #
      # An undeliverable alert is now HELD in railway/alert_outbox.json
      # (committed below) and delivered by alert-drain.yml. That is a kept
      # promise, so ci_alert.py exits 0 and this run stays green. It exits
      # non-zero only when the alert can be neither delivered NOR held — the one
      # state where nobody is ever going to hear about the failure.
      # The claim is a commit, so the committer has to exist before the alerter
      # runs. See the ALERT_STATE_COMMIT note below.
      - name: Identify the committer
        run: |
          git config user.name  'ai-layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'

      # RESEND_API_KEY, and no WP credential at all. This step no longer touches
      # asktherecruiter.com: `/alert` was a route on the host the alerts are
      # about, so the alarm went mute at exactly the moment it was needed, twice
      # on 2026-07-31 and twice again on 2026-08-19. Operational mail leaves
      # through Resend now. It also stops CI alerts sharing the subscriber
      # relay's 300-a-day free tier, where a bad afternoon of red runs could
      # have eaten the allowance the reader digest depends on.
      #
      # ALERT_STATE_COMMIT: the open/resolved ledger moved off the endpoint and
      # into railway/alert_state.json, and the claim is COMMITTED BEFORE THE
      # SEND. `git push` to main is the compare-and-swap that keeps two racing
      # runners from both mailing one cause. Set it here and nowhere a test can
      # see it.
      - name: Alert on failure / clear on recovery
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_MAIL_FROM: ${{ vars.OPS_MAIL_FROM }}
          OPS_MAIL_TO: ${{ vars.OPS_MAIL_TO }}
          ALERT_STATE_COMMIT: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_ENVELOPE: ${{ runner.temp }}/undelivered_alert.json
        run: |
          python3 railway/ci_alert.py \
            --run-id     "${{ github.event.workflow_run.id }}" \
            --workflow   "${{ github.event.workflow_run.name }}" \
            --conclusion "${{ github.event.workflow_run.conclusion }}" \
            --branch     "${{ github.event.workflow_run.head_branch }}" \
            --event      "${{ github.event.workflow_run.event }}" \
            --run-url    "${{ github.event.workflow_run.html_url }}"

      # Only does anything when the step above could not deliver. `!cancelled()`
      # rather than the default success gate, because the envelope is worth
      # committing even if that step then failed for its own reasons — an alert
      # on a runner's disk is an alert nobody will ever read.
      #
      # The retry loop RE-DERIVES rather than replaying a diff: fetch, reset onto
      # main, fold the envelope in again. `alert_outbox.py enqueue` is idempotent
      # in the alert's key, so a race with a concurrent alert costs a retry and
      # never a duplicate email.
      - name: Hold the alert until the relay is back
        if: ${{ !cancelled() }}
        env:
          ALERT_ENVELOPE: ${{ runner.temp }}/undelivered_alert.json
        run: |
          set -euo pipefail
          # The envelope lives OUTSIDE the workspace on purpose, so the
          # `git reset --hard` below cannot destroy the thing being saved.
          if [ ! -f "$ALERT_ENVELOPE" ]; then
            echo "The alert was delivered; there is nothing to hold."
            exit 0
          fi

          git config user.name  'ai-layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 railway/alert_outbox.py enqueue --envelope "$ALERT_ENVELOPE"
            git add railway/alert_outbox.json
            if git diff --staged --quiet; then
              echo "This alert was already held by another run."
              exit 0
            fi
            git commit -q -m "alert: held undelivered $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              echo "Held on attempt $attempt. alert-drain.yml will deliver it."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — re-deriving on current main."
            sleep $((attempt * 5))
          done

          echo "::error::The alert could not be delivered AND could not be held."
          echo "::error::It exists only on this runner, so the failure it"
          echo "::error::describes will reach nobody. This is the ONE alerting"
          echo "::error::failure worth a red run; every other kind is queued."
          exit 1
