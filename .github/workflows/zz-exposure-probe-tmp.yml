name: zz exposure probe (temporary, branch only)
on:
  push:
    branches: [claude/exposure-probe-tmp]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: pip install --require-hashes -r railway/requirements.lock >/dev/null
      - name: probe
        shell: python
        run: |
          import sys, io, zipfile, urllib.request, openpyxl, time
          sys.stdout = open('probe-out.txt', 'w')
          UA = "AiLayoffTracker/1.0 (+https://asktherecruiter.com; info@asktherecruiter.com)"
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=180).read()
          b = get("https://www.onetcenter.org/dl_files/database/db_31_0_text/Occupation%20Data.txt")
          print("ONET", len(b)); print(b.decode()[:600])
          b = get("https://www.bls.gov/emp/ind-occ-matrix/occupation.xlsx")
          wb = openpyxl.load_workbook(io.BytesIO(b), read_only=True)
          for ws in wb.worksheets:
              print("EPSHEET", ws.title)
              for k, r in enumerate(ws.iter_rows(values_only=True)):
                  if k < 4 or (ws.title.startswith("Table 1.2") and k < 12): print("  ", r)
                  else: break
          for name, member in [("nat", "oesm25nat/national_M2025_dl.xlsx"), ("ma", "oesm25ma/MSA_M2025_dl.xlsx")]:
              t = time.time()
              z = zipfile.ZipFile(io.BytesIO(get(f"https://www.bls.gov/oes/special-requests/oesm25{name}.zip")))
              ws = openpyxl.load_workbook(io.BytesIO(z.read(member)), read_only=True).worksheets[0]
              n = 0
              for k, r in enumerate(ws.iter_rows(values_only=True)):
                  n += 1
                  if k < 4: print(name, r)
              print(name, "rows", n, "secs", round(time.time() - t))
      - name: push result
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f probe-out.txt; git commit -qm "probe out [skip ci]"; git push origin HEAD:claude/exposure-probe-out -f
