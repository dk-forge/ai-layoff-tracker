name: Hawaii WARN OCR import

# Hawaii posts WARN notices as image-scan PDFs, so the affected-employee count
# is OCR-only. This installs tesseract, OCRs each notice, extracts the count with
# a calibrated skip-don't-guess extractor, and posts via the bulk endpoint (no
# LLM). Idempotent (dedup hash matches warn.py), so daily re-runs upsert in place.
# Required secret: WP_API_KEY. tesseract/pytesseract installed here only, kept out
# of the shared requirements so the other daily jobs stay lean and OCR-free.

on:
  schedule:
    - cron: '30 16 * * *'   # daily ~12:30pm ET, after the main WARN import
  workflow_dispatch:

jobs:
  hi-warn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Verify secret
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: '[ -n "$WP_API_KEY" ] || { echo "::error::WP_API_KEY not set."; exit 1; }'
      - name: Install tesseract (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install deps
        working-directory: railway
        run: |
          pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run Hawaii WARN OCR import
        working-directory: railway
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          # DeepSeek fallback for notices the deterministic extractor skips.
          # Verified clean in the dry-run (all recoveries >=5 and plausible; the
          # count must appear verbatim in the source). Falls back to regex-only
          # if the LLM is unavailable, so it can't reduce coverage.
          HI_LLM_FALLBACK: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python hi_warn_import.py
