name: WARN LLM fallback probe

# Manual verification job for the DeepSeek count-fallback wired into the fragile
# WARN scrapers. Runs those fetchers with WARN_LLM_FALLBACK=1 and PRINTS every
# row the fallback recovers (regex count was 0, LLM found one) as ::notice::
# lines. Posts NOTHING (no WP_API_KEY). Use it to review recoveries before
# enabling the fallback in the live import. Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated states to probe (blank = all fragile ones)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Probe (prints recoveries, posts nothing)
        working-directory: railway
        env:
          WARN_LLM_FALLBACK: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROBE_STATES: ${{ github.event.inputs.states }}
        run: python warn_llm_probe.py
