name: Enrich announcement and domicile evidence

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Rows to reassess (1-50; scheduled default is 5)'
        required: false
        default: '5'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      # Earned cadence (railway/spend.py). A QUEUE-DRAINING job that has spent
      # and produced nothing for several consecutive runs has an empty queue,
      # so it drops to one run in three until it produces again. It cannot miss
      # anything: the queue is still there next run and the job resumes where
      # it stopped. Discovery collectors are deliberately NOT eligible - running
      # one less often is a coverage decision, and spend.earned_skip refuses to
      # make it. Always exits 0; a job must not go red for being thrifty.
      - name: Earned cadence
        id: cadence
        run: python railway/spend.py --cadence
      - name: Spend guard (degrade, never halt)
        if: steps.cadence.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      # google-cloud-bigquery powers the alternate-source finder; the worker
      # fails soft to snapshot/primary-only behavior if it is ever missing.
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
        if: steps.cadence.outputs.skip != 'true'
      - name: Enrich only exact source-supported context
        if: steps.cadence.outputs.skip != 'true'
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GCP_BIGQUERY_CREDENTIALS_JSON: ${{ secrets.GCP_BIGQUERY_CREDENTIALS_JSON }}
          CONTEXT_ENRICH_BATCH: ${{ github.event.inputs.batch || '5' }}
          # The Wayback/alternate fallbacks add bounded per-row network work;
          # the worker stops safely between rows before the job ceiling.
          CONTEXT_DEADLINE_SECONDS: '900'
          # Prioritise source-linked US announced AI candidates for the public
          # Survey comparator. Exact quotes remain mandatory for updates.
          CONTEXT_ENRICH_MODE: survey_priority
        run: |
          cd railway
          python enrich_context.py
