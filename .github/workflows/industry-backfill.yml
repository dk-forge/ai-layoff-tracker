name: Industry backfill

# Bounded daily classification of blank-industry rows from each row's own
# company name + STORED excerpt only (fixed vocabulary; two independent model
# passes must agree before a fill is written). Writes through the blank-only
# /industry-backfill endpoint, which re-validates the label, never overwrites a
# set industry, and never pins a row. It never re-fetches sources and never
# touches counts/dates/stages/sources/AI labels.
on:
  schedule:
    # ---- DRAIN SPRINT (temporary, pre-launch) --------------------------------
    # The sector table understates every industry while rows sit unclassified
    # (20,955 blank as of 2026-07-24), so the backlog must clear BEFORE launch.
    # 8 shards x 200 rows x 8 runs/day = ~12,800 rows/day -> drains in ~2 days.
    # With the narrow-prompt fix each row is ~$0.0002, so the whole drain is ~$4.
    #
    # SELF-LIMITING: once the backlog is empty the job finds nothing to classify
    # and makes no model calls, so leaving this on does not keep costing money -
    # it just runs more often than needed. Revert to the cheap trickle with:
    #   cron -> '55 4 * * *'   |   matrix shard -> [0]   |   INDUSTRY_SHARDS -> '1'
    # SPRINT ENDED 2026-07-28. The 20,955-row backlog is drained; what remains is
    # ~400 rows where the two passes DISAGREE, and a disagreement writes NO
    # marker, so those rows re-enter the queue forever. The "self-limiting"
    # premise above is FALSE for that residue: measured 2026-07-28, the hourly
    # sprint was re-classifying 1,423 rows/run (99.7% identical hour to hour,
    # 0.2% yield) = ~68,000 LLM calls/day ~= $7/day for ~3 fills. Reverted to
    # the daily trickle per the instructions above.
    - cron: '55 4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Rows to classify this run (1-200; scheduled default 200)'
        required: false
        default: '200'
      dry_run:
        description: 'Set 1 to classify and print without writing'
        required: false
        default: ''
      single_pass:
        description: 'Set 1 to disable the second confirmation pass (spot checks only)'
        required: false
        default: ''

# The endpoint fills blank rows idempotently, but two overlapping runs would
# waste model calls racing the same rotation slice.

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Concurrency lives on the JOB, not the workflow: a workflow-level group
    # cannot reference `matrix` (that is a hard workflow-file error), and a
    # static workflow-level group would serialize the shards and defeat the
    # whole point. Per-shard grouping lets the four run together while a re-run
    # of the SAME shard still queues behind itself.
    concurrency:
      group: industry-backfill-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      # DRAIN SPRINT: 8 shards. Even shards scan largest-first, odd shards
      # newest-first, so the headline sector figures AND the distribution both
      # improve as it drains (see fetch_candidates). Drop back to [0] after.
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Classify blank industries
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INDUSTRY_BACKFILL_BATCH: ${{ github.event.inputs.batch || '200' }}
          INDUSTRY_SHARD: ${{ matrix.shard }}
          INDUSTRY_SHARDS: '1'
          INDUSTRY_BACKFILL_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
          INDUSTRY_BACKFILL_SINGLE_PASS: ${{ github.event.inputs.single_pass || '' }}
          # Stops safely between rows well below the job timeout; the daily
          # rotation resumes where the queue left off.
          INDUSTRY_BACKFILL_DEADLINE_SECONDS: '900'
          OPENROUTER_TIMEOUT_SECONDS: '35'
        # Data-changing jobs fail loudly: a rejected label (vocabulary drift),
        # a health-write failure, or a fully failed model pass exits non-zero.
        run: |
          set -o pipefail
          cd railway
          for attempt in 1 2 3; do
            python industry_backfill.py | tee -a "$GITHUB_STEP_SUMMARY" && exit 0
            echo "::warning::attempt $attempt failed; auto-retrying in $((attempt*45))s (transient, not paging you)"
            sleep $((attempt*45))
          done
          echo "::error::still failing after 3 attempts - a real failure, worth a look"
          exit 1
