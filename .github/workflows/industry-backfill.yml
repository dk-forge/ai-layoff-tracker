name: Industry backfill

# Bounded daily classification of blank-industry rows from each row's own
# company name + STORED excerpt only (fixed vocabulary; two independent model
# passes must agree before a fill is written). Writes through the blank-only
# /industry-backfill endpoint, which re-validates the label, never overwrites a
# set industry, and never pins a row. It never re-fetches sources and never
# touches counts/dates/stages/sources/AI labels.
on:
  schedule:
    # 8x/day at the max safe batch (1,600 rows/day). The blank-industry backlog measured 42,028
    # rows on 2026-07-23; at the old 40/day this would never drain (~1,000 days).
    # The worker stops safely on its own deadline, so a full batch that runs long
    # simply resumes next slot.
    - cron: '55 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Rows to classify this run (1-200; scheduled default 200)'
        required: false
        default: '200'
      dry_run:
        description: 'Set 1 to classify and print without writing'
        required: false
        default: ''
      single_pass:
        description: 'Set 1 to disable the second confirmation pass (spot checks only)'
        required: false
        default: ''

# The endpoint fills blank rows idempotently, but two overlapping runs would
# waste model calls racing the same rotation slice.

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Concurrency lives on the JOB, not the workflow: a workflow-level group
    # cannot reference `matrix` (that is a hard workflow-file error), and a
    # static workflow-level group would serialize the shards and defeat the
    # whole point. Per-shard grouping lets the four run together while a re-run
    # of the SAME shard still queues behind itself.
    concurrency:
      group: industry-backfill-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      # 4 parallel shards. Each strides every 4th page of the blank-industry
      # scan, so together they cover the same pages the single job did, in a
      # quarter of the wall time and with the same total request load.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install openai requests
      - name: Classify blank industries
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INDUSTRY_BACKFILL_BATCH: ${{ github.event.inputs.batch || '200' }}
          INDUSTRY_SHARD: ${{ matrix.shard }}
          INDUSTRY_SHARDS: '4'
          INDUSTRY_BACKFILL_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
          INDUSTRY_BACKFILL_SINGLE_PASS: ${{ github.event.inputs.single_pass || '' }}
          # Stops safely between rows well below the job timeout; the daily
          # rotation resumes where the queue left off.
          INDUSTRY_BACKFILL_DEADLINE_SECONDS: '900'
          OPENROUTER_TIMEOUT_SECONDS: '35'
        # Data-changing jobs fail loudly: a rejected label (vocabulary drift),
        # a health-write failure, or a fully failed model pass exits non-zero.
        run: |
          set -o pipefail
          cd railway
          for attempt in 1 2 3; do
            python industry_backfill.py | tee -a "$GITHUB_STEP_SUMMARY" && exit 0
            echo "::warning::attempt $attempt failed; auto-retrying in $((attempt*45))s (transient, not paging you)"
            sleep $((attempt*45))
          done
          echo "::error::still failing after 3 attempts - a real failure, worth a look"
          exit 1
