name: Foreign filings ingest (EDINET JP + OpenDART KR)

# Downloads recent JP/KR official filings, and when one carries a STRONG layoff
# vocabulary match, routes the excerpt through the same extractor + guards +
# poster as every other source (so a misread filing posts nothing). Low yield
# by nature; ships DORMANT per market. Keys already exist.
#
# Secrets: EDINET_API_KEY_JP and/or OPENDART_API_KEY_KR, OPENROUTER_API_KEY, WP_API_KEY

on:
  # RETIRED 2026-07-24: after months live this ingested ZERO layoff rows (JP/KR
  # regulatory filings essentially never announce layoffs; that coverage comes
  # from news + ERM). Scheduled run disabled to stop the waste; still runnable
  # on demand if the JP/KR body-parsing is ever built out.
  # schedule:
  #   - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to 1 to log candidates without posting'
        required: false
        default: ''

jobs:
  foreign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Install deps
        working-directory: railway
        run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Run foreign filings ingest
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          EDINET_API_KEY_JP: ${{ secrets.EDINET_API_KEY_JP }}
          OPENDART_API_KEY_KR: ${{ secrets.OPENDART_API_KEY_KR }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          FOREIGN_DRY: ${{ github.event.inputs.dry_run }}
        run: python foreign_filings_ingest.py
