name: Reconcile US AI announcements with Survey

# Survey publishes a monthly public report but not its per-event database.
# This workflow measures the gap; it never changes data merely to match a
# benchmark. A threshold miss fails loudly so the autonomous backfill and
# classification jobs can be investigated.
on:
  schedule:
    - cron: '0 17 7 * *' # 1 PM ET on the 7th; after the usual monthly report window
  workflow_dispatch:
    inputs:
      year:
        description: 'Calendar year to reconcile'
        required: false
        default: '2026'
      allowed_variance:
        description: 'Absolute allowed variance, e.g. 0.10 for 10%'
        required: false
        default: '0.10'
      fail_on_gap:
        description: 'Fail the run for an expected coverage gap (normally false; processing errors always fail)'
        required: false
        type: boolean
        default: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Compare like-for-like published totals
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          BENCHMARK_YEAR: ${{ github.event.inputs.year || '2026' }}
          # Competitor benchmark data via secrets, never the repo. Unset -> the
          # reconciliation runs dormant (nothing to compare), which is correct.
          SURVEY_FEED_URL: ${{ secrets.SURVEY_FEED_URL }}
          SURVEY_BENCHMARK_JSON: ${{ secrets.SURVEY_BENCHMARK_JSON }}
          SURVEY_ALLOWED_VARIANCE: ${{ github.event.inputs.allowed_variance || '0.10' }}
          SURVEY_FAIL_ON_GAP: ${{ github.event.inputs.fail_on_gap || 'false' }}
        run: |
          cd railway
          set -o pipefail
          python survey_reconcile.py | tee survey-reconciliation.json
          cp survey-reconciliation.json "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-reconciliation
          path: railway/survey-reconciliation.json
