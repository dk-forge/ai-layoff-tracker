name: Hawaii WARN OCR dry-run

# DORMANT verification job. Hawaii's WARN notices are image-scan PDFs, so the
# affected-employee count is OCR-only. This manually-dispatched job installs
# tesseract, OCRs recent Hawaii notices, and PRINTS the extracted counts so a
# human can judge accuracy before the source is promoted to live. It posts
# NOTHING (no WP_API_KEY used). Manual dispatch only — never scheduled.
# pytesseract + tesseract installed here only, kept out of the shared
# requirements so the daily jobs stay lean and OCR-free.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated years to crawl (blank = last/this/next)'
        required: false
        default: ''
      limit:
        description: 'Stop after N successful extractions (blank = all)'
        required: false
        default: ''
      llm_fallback:
        description: 'Enable the DeepSeek fallback for regex-skipped notices (1 = on)'
        required: false
        default: ''

jobs:
  hi-warn-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Install tesseract (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install deps
        working-directory: railway
        run: |
          pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Hawaii WARN OCR dry-run (prints only, posts nothing)
        working-directory: railway
        env:
          HI_DRYRUN_YEARS: ${{ github.event.inputs.years }}
          HI_DRYRUN_LIMIT: ${{ github.event.inputs.limit }}
          HI_LLM_FALLBACK: ${{ github.event.inputs.llm_fallback }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python hi_warn_dryrun.py
