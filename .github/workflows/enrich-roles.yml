name: Extract affected-role categories

# Bounded daily backfill: maps roles explicitly stated in already-stored row
# text (roles/excerpt/quotes — no external fetches) onto the fixed category
# vocabulary via the keyed /enrich-roles endpoint. Rows whose stored evidence
# does not state the roles are marked checked-unknown so the queue drains;
# nothing is ever guessed and no count/date/source/AI label can change.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Rows to check (1-200; scheduled default is 40)'
        required: false
        default: '40'

concurrency:
  group: enrich-roles
  cancel-in-progress: false

jobs:
  enrich-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      # Earned cadence (railway/spend.py). A QUEUE-DRAINING job that has spent
      # and produced nothing for several consecutive runs has an empty queue,
      # so it drops to one run in three until it produces again. It cannot miss
      # anything: the queue is still there next run and the job resumes where
      # it stopped. Discovery collectors are deliberately NOT eligible - running
      # one less often is a coverage decision, and spend.earned_skip refuses to
      # make it. Always exits 0; a job must not go red for being thrifty.
      - name: Earned cadence
        id: cadence
        run: python railway/spend.py --cadence
      - name: Spend guard (degrade, never halt)
        if: steps.cadence.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
        if: steps.cadence.outputs.skip != 'true'
      - name: Extract role categories from stored evidence only
        if: steps.cadence.outputs.skip != 'true'
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ROLES_BATCH: ${{ github.event.inputs.batch || '40' }}
          # Stop safely between rows well before the 20-minute Actions limit.
          ROLES_DEADLINE_SECONDS: '900'
          OPENROUTER_TIMEOUT_SECONDS: '35'
        run: |
          cd railway
          python enrich_roles.py
