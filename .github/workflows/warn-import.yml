name: WARN notice import (US states)

# Pulls state WARN Act notices (via the open warn-scraper), maps them to the
# tracker schema, and posts them directly (no LLM, so no API cost). Idempotent.
# Runs daily at 13:00 UTC (9 AM ET during EDT) and on manual dispatch.
# NB other workflows time themselves against this one, so keep this line and
# the cron below in step: several of them used to say "after WARN (11 AM)".
# Required secret: WP_API_KEY.

on:
  schedule:
    - cron: '0 13 * * *'   # 9 AM ET: morning ingest window
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma list of state codes, or all (manual runs almost always want all)'
        required: true
        default: 'all'
      min_employees:
        description: 'Drop notices below this headcount (0 = keep all)'
        required: false
        default: '0'
      start:
        description: 'Earliest effective date YYYY-MM-DD (blank = all history)'
        required: false
        default: ''
      limit:
        description: 'Max posts (blank = no cap)'
        required: false
        default: ''
      purge:
        description: 'Purge table-only WARN rows first (clean reload)'
        required: false
        default: ''
      quebec_months:
        description: 'Quebec monthly PDFs to read back (4 = daily default, 40 = the whole CDN archive to 2023-08)'
        required: false
        default: ''

permissions:
  contents: write   # commit the ratcheted per-state baselines

jobs:
  warn:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Verify secret
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          [ -n "$WP_API_KEY" ] || { echo "::error::WP_API_KEY not set."; exit 1; }
      - name: Install deps
        working-directory: railway
        # The PyPI warn-scraper release predates the ND scraper, and its git
        # sdist cannot build (setup imports its own runtime deps). Inject just
        # nd.py from a pinned upstream commit into the installed package; the
        # import self-check fails the job loudly on any incompatibility, and
        # per-state subprocess isolation caps any runtime surprise at one
        # state's output. (MS's upstream scraper needs the camelot/ghostscript
        # stack — deferred to the custom-parser list instead.)
        run: |
          pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
          BASE=https://raw.githubusercontent.com/biglocalnews/warn-scraper/f7b3dd26af1f3ad700762504bd7c5c0d23979507
          SCRAPERS_DIR=$(python -c "import warn.scrapers, os; print(os.path.dirname(warn.scrapers.__file__))")
          curl -sSf "$BASE/warn/scrapers/nd.py" -o "$SCRAPERS_DIR/nd.py"
          python -c "import warn.scrapers.nd; print('injected ND scraper import OK')"
      - name: Mark pipeline refreshing
        run: |
          curl -sS -X POST "https://asktherecruiter.com/blog/wp-json/layoffs/v1/status" \
            -H "X-Layoff-API-Key: ${{ secrets.WP_API_KEY }}" -H "Content-Type: application/json" \
            -H "User-Agent: AiLayoffTracker/1.0 (+https://asktherecruiter.com)" \
            -d '{"phase":"refreshing"}' || true
      - name: Run WARN import
        working-directory: railway
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          # Scheduled runs have no inputs — default to a full nationwide sweep.
          WARN_STATES: ${{ github.event.inputs.states || 'all' }}
          WARN_MIN_EMPLOYEES: ${{ github.event.inputs.min_employees || '0' }}
          WARN_START: ${{ github.event.inputs.start || '' }}
          WARN_LIMIT: ${{ github.event.inputs.limit || '' }}
          WARN_PURGE: ${{ github.event.inputs.purge || '' }}
          # Quebec reads the last 4 monthly PDFs on a scheduled run, which is
          # all a daily job needs. The CDN holds 36 months, so a BACKFILL is a
          # manual dispatch with quebec_months=40: it costs nothing but
          # bandwidth (no LLM on this path) and the dedup hash makes it
          # idempotent against everything already stored.
          QUEBEC_MONTHS: ${{ github.event.inputs.quebec_months || '4' }}
          # DeepSeek count-fallback for the fragile scrapers (FL/GA/MI/NY/ID/LA/
          # WA/MS/WV). Dormant today (probe: zero firings after the NY regex fix);
          # activates only when a site shifts a column/label, reading that one
          # row's text for a count that must appear verbatim in it. Regex-only if
          # the LLM is down, so it can never reduce coverage. NC excluded.
          WARN_LLM_FALLBACK: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python warn_import.py && exit 0
            echo "::warning::attempt $attempt failed; auto-retrying in $((attempt*45))s"
            sleep $((attempt*45))
          done
          echo "::error::still failing after 3 attempts"
          exit 1

      # The per-state floors are what turn "the scraper answered" into "the
      # scraper answered with the whole state". They only ever ratchet UP, so
      # the merge against origin/main is a max() and can never be lost to a
      # race — and a failure to record them must not redden a successful
      # import, hence `|| true` on the push.
      # Only a run that COMPLETED may teach a floor: a half-finished sweep's
      # counts are not evidence of how much a state normally yields.
      - name: Commit the ratcheted per-state baselines
        run: |
          set -euo pipefail
          git config user.name  'ai-layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'
          # The import wrote this file; `git reset` below would throw it away.
          cp railway/warn_state_baselines.json "$RUNNER_TEMP/warn_baselines.json"
          for attempt in 1 2 3; do
            cp "$RUNNER_TEMP/warn_baselines.json" railway/warn_state_baselines.json
            git fetch -q origin main
            python - <<'PY'
          import json, subprocess
          P = "railway/warn_state_baselines.json"
          mine = json.load(open(P))
          try:
              theirs = json.loads(subprocess.check_output(
                  ["git", "show", f"origin/main:{P}"], text=True))
          except Exception:
              theirs = {}
          for tier, m in theirs.items():
              out = mine.setdefault(tier, {})
              for st, v in (m or {}).items():
                  out[st] = max(out.get(st, 0), v)   # upward-only merge
          json.dump({t: dict(sorted(m.items())) for t, m in sorted(mine.items())},
                    open(P, "w"), indent=2, sort_keys=True)
          open(P, "a").write("\n")
          PY
            git add railway/warn_state_baselines.json
            if git diff --staged --quiet; then
              echo "Baselines unchanged."; exit 0
            fi
            git commit -q -m "warn: ratchet per-state baselines $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              echo "Recorded on attempt $attempt."; exit 0
            fi
            git reset -q --hard origin/main
          done
          echo "::warning::could not record baselines after 3 attempts (import itself succeeded)"
