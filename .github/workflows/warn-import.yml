name: WARN notice import (US states)

# Pulls state WARN Act notices (via the open warn-scraper), maps them to the
# tracker schema, and posts them directly (no LLM, so no API cost). Idempotent.
# Runs daily at 15:00 UTC (11 AM ET during EDT) and on manual dispatch.
# Required secret: WP_API_KEY.

on:
  schedule:
    - cron: '0 13 * * *'   # 9 AM ET: morning ingest window
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma list of state codes, or all (manual runs almost always want all)'
        required: true
        default: 'all'
      min_employees:
        description: 'Drop notices below this headcount (0 = keep all)'
        required: false
        default: '0'
      start:
        description: 'Earliest effective date YYYY-MM-DD (blank = all history)'
        required: false
        default: ''
      limit:
        description: 'Max posts (blank = no cap)'
        required: false
        default: ''
      purge:
        description: 'Purge table-only WARN rows first (clean reload)'
        required: false
        default: ''

jobs:
  warn:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          [ -n "$WP_API_KEY" ] || { echo "::error::WP_API_KEY not set."; exit 1; }
      - name: Install deps
        working-directory: railway
        # warn-scraper's PyPI release predates the ms.py/nd.py scrapers, and
        # its sdist at the pinned commit imports jinja2 at build time (an
        # upstream packaging gap), so the git install needs the build dep
        # preinstalled and isolation off. Pinned by commit for reproducibility;
        # the shared requirements.txt keeps the PyPI floor for every other job.
        run: |
          pip install -r requirements.txt
          pip install jinja2
          pip install --no-build-isolation "warn-scraper @ git+https://github.com/biglocalnews/warn-scraper@f7b3dd26af1f3ad700762504bd7c5c0d23979507"
      - name: Mark pipeline refreshing
        run: |
          curl -sS -X POST "https://asktherecruiter.com/blog/wp-json/layoffs/v1/status" \
            -H "X-Layoff-API-Key: ${{ secrets.WP_API_KEY }}" -H "Content-Type: application/json" \
            -H "User-Agent: AiLayoffTracker/1.0 (+https://asktherecruiter.com)" \
            -d '{"phase":"refreshing"}' || true
      - name: Run WARN import
        working-directory: railway
        env:
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          # Scheduled runs have no inputs — default to a full nationwide sweep.
          WARN_STATES: ${{ github.event.inputs.states || 'all' }}
          WARN_MIN_EMPLOYEES: ${{ github.event.inputs.min_employees || '0' }}
          WARN_START: ${{ github.event.inputs.start || '' }}
          WARN_LIMIT: ${{ github.event.inputs.limit || '' }}
          WARN_PURGE: ${{ github.event.inputs.purge || '' }}
        run: python warn_import.py
