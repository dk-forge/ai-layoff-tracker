# Ingest silence alarm: "is ANY collector running?"
#
# 2026-09: Railway's ingest cron was retired and the repo variable
# ALT_INGEST_ON_VPS was never set, so neither host ran the daily ingest for
# seven days and every monitor stayed green (see railway/ingest_silence.py for
# why run_completion and source_freshness cannot see this). This job reads the
# newest /source-runs note once a day and goes red, and opens ONE issue, when
# nothing has run for two days.
#
# Deliberately on GitHub-hosted runners: a watchdog for "the hosts are off"
# must not depend on those hosts.
#
# 2026-11-05: a second job, `yield`, asks "did the ingest BRING anything?".
# From 2026-10-28 every nightly run pulled 800+ candidates and posted 0
# (paid reads OFF, key limit reached) while `check` stayed green, because the
# collectors kept writing fresh notes. railway/ingest_yield.py mails the owner
# ONCE per incident through ops_notify (dedupe_key), and once on recovery.
name: Ingest silence alarm

on:
  schedule:
    - cron: '17 9 * * *'   # daily, well after the 22:00 UTC ingest slot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-silence
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Newest collector run must be under 2 days old
        id: probe
        run: |
          set +e
          python3 railway/ingest_silence.py | tee silence.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open (or reuse) one issue when ingest is silent
        if: steps.probe.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Ingest silent: no collector has run for 2+ days"
          # Exact-title match: `--search ... in:title` is a fuzzy word match and
          # skipped creation when unrelated open issues shared words (2026-10-05).
          open=$(gh issue list --state open --limit 200 --json title | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "$(cat silence.txt)

          Neither ingest host appears to be running. Check Railway's cron and the repo variable ALT_INGEST_ON_VPS (ingest-cron-vps.yml). Raised by .github/workflows/ingest-silence.yml."
          fi
      - name: Fail the run on silence or unknown
        if: steps.probe.outputs.code != '0'
        run: |
          echo "::error::$(cat silence.txt)"
          exit 1

  yield:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # commit the alarm claim to railway/alert_state.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Identify the committer
        run: |
          git config user.name  'ai-layoff-tracker-bot'
          git config user.email 'bot@users.noreply.github.com'
      - name: Paid reads on, and the ingest posting events
        working-directory: railway
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_MAIL_TO: ${{ vars.OPS_MAIL_TO }}
          OPS_MAIL_FROM: ${{ vars.OPS_MAIL_FROM }}
          ALERT_STATE_COMMIT: '1'
        run: python3 ingest_yield.py
