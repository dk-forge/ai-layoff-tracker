name: CA WARN annual-PDF backfill (manual)

# Backfills California WARN HISTORY from EDD annual-report PDFs (the live rolling
# xlsx only holds the current fiscal year). Manual dispatch ONLY — never on a
# schedule. Run once with dry_run=true to eyeball the parse, then dry_run=false
# to upsert. Fails loudly if zero notices parse.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse + print a sample WITHOUT posting (validate first)'
        required: false
        type: boolean
        default: true
      pdf_urls:
        description: 'Optional comma/newline list of EDD annual PDF URLs (overrides the built-in list)'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements.lock
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements.lock
      - name: Backfill CA WARN history
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          CA_BACKFILL_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          CA_BACKFILL_PDF_URLS: ${{ github.event.inputs.pdf_urls || '' }}
        run: |
          cd railway
          set -o pipefail
          python ca_backfill.py
