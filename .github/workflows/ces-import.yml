name: BLS CES hours and earnings reference data

# Keyless BLS API v1 pull: CES average weekly hours + average hourly earnings,
# all employees, seasonally adjusted, national, per NAICS supersector (26
# series, 2 requests of the 25/day keyless budget) -> /reference-ingest/
# bls_ces_hours. "Hours cut before headcount" context for #478 item 9.
# LABELED MACRO CONTEXT, never summed into layoff counts and not read by ingest
# or classification. Fail-soft: a failed or partial pull never overwrites
# stored data. Freshness: reference-freshness.yml.

on:
  schedule:
    - cron: '41 15 * * 5'   # Fridays; the Employment Situation lands the first Friday
  workflow_dispatch:

permissions:
  contents: write   # commit the deferral ledger, and only when it changed

concurrency:
  group: ces-import

jobs:
  ces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Fetch + store BLS CES reference data
        working-directory: railway
        env:
          PYTHONUNBUFFERED: '1'
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: python ces_import.py

      - name: Record the deferral ledger
        if: ${{ always() }}
        uses: ./.github/actions/commit-deferral-ledger
        with:
          job: ces-import
