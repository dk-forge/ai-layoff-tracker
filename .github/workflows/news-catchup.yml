name: News catch-up (last N days)

# Pulls the last N days of layoff news (Reuters/Bloomberg/TechCrunch/wires/etc.)
# and posts verified events — the source where AI-attributed layoffs actually
# appear. Idempotent (dedup guard).
#
# Runs on a SCHEDULE as the wide-lookback safety net: the daily cron only looks
# back a few days, and with NewsAPI's ~24h index delay + weekend gaps an
# announcement can fall out of every daily window before it is ever seen. This
# weekly ~14-day re-sweep recaptures those before they age past NewsAPI's ~30-day
# history ceiling. Idempotent, so re-sweeping is safe. Also manually dispatchable.
#
# Required secrets: NEWSAPI_KEY, OPENROUTER_API_KEY, WP_API_KEY

on:
  schedule:
    - cron: '30 9 * * 1'   # weekly, Monday 09:30 UTC (after the weekend)
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back (NewsAPI free tier caps at ~30)'
        required: false
        default: '28'

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Spend guard (railway/spend.py). When this month's measured spend is
      # past the allowance it sets ALT_PAID_READS=off for every step below, and
      # extractor.py then refuses each paid call and returns the caller's
      # "retry later" value. It NEVER fails the job: the free collectors in
      # this workflow keep running and every deferred candidate is left
      # UNMARKED, so a later run reads it. Stdlib only, so it needs no install.
      - name: Spend guard (degrade, never halt)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python railway/spend.py --degrade
      - name: Verify secrets
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          GCP_BIGQUERY_CREDENTIALS_JSON: ${{ secrets.GCP_BIGQUERY_CREDENTIALS_JSON }}
        run: |
          missing=0
          for v in NEWSAPI_KEY OPENROUTER_API_KEY WP_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set."; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Add the missing secret(s) and re-run."; exit 1; }
      - name: Install deps
        working-directory: railway
        run: pip install -r requirements.txt
      - name: Run news catch-up
        working-directory: railway
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_SITE_URL: https://asktherecruiter.com/blog
          # On a scheduled run there is no dispatch input, so fall back to 14.
          NEWS_DAYS_BACK: ${{ github.event.inputs.days || '14' }}
        run: python news_catchup.py
