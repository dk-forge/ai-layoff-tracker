name: Employer-domicile curated backfill

# Manual, bounded, idempotent: fills ONLY blank employer_country fields on
# 'Multiple countries' rows from the committed curated HQ registry
# (railway/seed_data/employer_domicile.json). Re-running is a no-op.
on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: 'Largest multi-country rows to examine (registry match still required)'
        required: false
        default: '400'
      dry_run:
        description: 'Set to 1 to list matches without writing'
        required: false
        default: ''

permissions:
  contents: write   # commit the deferral ledger, and only when it changed

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements-min.lock
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Backfill curated employer domicile
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          DOMICILE_BACKFILL_MAX_ROWS: ${{ github.event.inputs.max_rows || '400' }}
          DOMICILE_BACKFILL_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
        run: |
          cd railway
          python employer_domicile_backfill.py | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -eo pipefail {0}

      # A deferral nobody counts is a silently green job, which is the exact
      # failure family this repo keeps digging out of. Free on a healthy run: a
      # job with no open deferral touches no file, so there is no diff, no
      # commit and no push.
      - name: Record the deferral ledger
        if: ${{ always() }}
        uses: ./.github/actions/commit-deferral-ledger
        with:
          job: employer-domicile-backfill
