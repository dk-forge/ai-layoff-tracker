name: Apply a signed-off correction

# Manual only, never scheduled. Published corrections governance says a numeric
# change always needs a human sign-off, so the dispatch itself IS the sign-off
# and the required `reason` is recorded on the row's suppression list.
# Defaults to a dry run: you must tick `apply` to write anything.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Table row id(s), comma-separated (the id the /query API returns)"
        required: true
      action:
        description: "trash (count unsupported by its source) or edit (fix a field)"
        required: true
        default: trash
        type: choice
        options: [trash, edit]
      reason:
        description: "Why, in plain words. Recorded permanently."
        required: true
      fields:
        description: 'edit only: JSON of fields, e.g. {"job_count": 4500}'
        required: false
        default: ""
      verify_company:
        description: "Company name, used to show the row before and after"
        required: false
        default: ""
      apply:
        description: "Actually write. Leave false for a dry run."
        required: true
        default: false
        type: boolean

jobs:
  correct:
    runs-on: ubuntu-latest
    # This was the ONE workflow in this repo carrying no ceiling, so it inherited
    # GitHub's 6-hour default while holding WP_API_KEY.
    #
    # MEASURED 2026-08-13: UNKNOWN, honestly. There have only ever been two runs
    # (2026-08-11 and 2026-08-12), both 0.3 min, and two points are not a
    # distribution. So this is sized generously rather than tightly: `ids` takes
    # a comma-separated LIST and the script calls the host once per id, so a
    # sign-off covering many rows legitimately runs far longer than either
    # observed run, and a ceiling fitted to n=2 would redden the first real
    # bulk correction. 30 = ~100x what has been seen, ~12x tighter than the
    # default, and short enough that a hung run cannot sit on a live key all
    # night. Re-derive it once there are ten runs to read.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Restore pip's wheel cache, keyed on THIS lock's own hash. A lock
          # change changes the key, so a cache entry can never outlive the lock
          # that vouched for it, and the hash-verified install below still
          # checks every artifact it uses. The two locks are keyed separately
          # on purpose: a health job must not pull the heavy cache.
          cache: 'pip'
          cache-dependency-path: railway/requirements-min.lock
      - run: pip install --require-hashes -r $GITHUB_WORKSPACE/railway/requirements-min.lock
      - name: Apply correction
        # Inputs go through env, never straight into the shell line: a reason is
        # free text (quotes, apostrophes, backticks) and interpolating it into
        # `run:` would be both fragile and a script-injection hole.
        env:
          WP_SITE_URL: https://asktherecruiter.com/blog
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          IN_IDS: ${{ inputs.ids }}
          IN_ACTION: ${{ inputs.action }}
          IN_REASON: ${{ inputs.reason }}
          IN_FIELDS: ${{ inputs.fields }}
          IN_COMPANY: ${{ inputs.verify_company }}
          IN_APPLY: ${{ inputs.apply }}
        run: |
          ARGS=()
          if [ "$IN_APPLY" = "true" ]; then ARGS+=(--apply); fi
          python3 railway/apply_correction.py \
            --ids "$IN_IDS" \
            --action "$IN_ACTION" \
            --reason "$IN_REASON" \
            --fields "$IN_FIELDS" \
            --verify-company "$IN_COMPANY" \
            "${ARGS[@]}"
