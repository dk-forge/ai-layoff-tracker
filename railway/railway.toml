# Railway config-as-code for the layoff-cron service.
#
# NOTE (spec deviation): the original spec used a [[services]] array with two
# cron services in one file. Railway does not parse that shape — a railway.toml
# configures exactly ONE service, and the schedule would be silently ignored.
# Both daily runs are expressed instead as a comma list in a single cron
# expression on this service.
#
# Timezone note: Railway cron runs in UTC. 12:00/22:00 UTC == 8 AM / 6 PM
# Eastern during daylight saving (EDT, summer). In winter (EST, UTC-5) these
# fire at 7 AM / 5 PM Eastern. The morning run catches overnight news + the
# prior day's after-close 8-Ks; the evening run catches same-day filings made
# after the 4 PM ET market close. To hold 8 AM/6 PM year-round you'd shift to
# "0 13,23 * * *" in winter.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python cron.py"
cronSchedule = "0 13,22 * * *"
restartPolicyType = "NEVER"
