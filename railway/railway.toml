# Railway config-as-code for the layoff-cron service.
#
# NOTE (spec deviation): the original spec used a [[services]] array with two
# cron services in one file. Railway does not parse that shape — a railway.toml
# configures exactly ONE service, and the schedule would be silently ignored.
# Both daily runs are expressed instead as a comma list in a single cron
# expression on this service.
#
# Once daily since 2026-08-14, the owner's freshness-for-cost call: the
# product updates daily, one pull at noon US Eastern lands after the full
# morning news cycle (overnight news, the prior day's after-close 8-Ks, and
# the morning announcement window). Same decision as the talent tracker's
# collect.yml. Cost: halves the paid discovery/extraction runs. Trade: filings
# made after the 4 PM ET close now appear the NEXT day rather than same-day.
#
# Timezone note: Railway cron runs in UTC. 16:00 UTC == noon Eastern during
# daylight saving (EDT, summer); in winter (EST, UTC-5) it fires at 11 AM
# Eastern. To hold noon year-round shift to "0 17 * * *" in winter.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python cron.py"
cronSchedule = "0 16 * * *"
restartPolicyType = "NEVER"
